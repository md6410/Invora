<style>
/* Layout: top bar with tabs; editor = form column + sticky A4 preview column. Paper styles are print-true (mm/pt). */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#f6f7f5; --line:#d7dbd7; --fg:#1d2321; --muted:#5f6864;
  --accent:#1e5a55; --accent-ink:#ffffff; --accent-soft:#e1edeb; --warn:#9a5a0b; --warn-soft:#fbf1e1;
  --danger:#a8261b; --ok:#2c7149; --ok-soft:#e3f1e8; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.06);
  --ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --line:#2e3533; --fg:#e4e8e6; --muted:#9aa49f;
  --accent:#72b9ae; --accent-ink:#0d1716; --accent-soft:#1f3532; --warn:#e2a54f; --warn-soft:#352a1a;
  --danger:#ef8579; --ok:#79c895; --ok-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --line:#2e3533; --fg:#e4e8e6; --muted:#9aa49f;
  --accent:#72b9ae; --accent-ink:#0d1716; --accent-soft:#1f3532; --warn:#e2a54f; --warn-soft:#352a1a;
  --danger:#ef8579; --ok:#79c895; --ok-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:var(--ui-size,14px)/1.7 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.mark{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 4px rgba(18,59,55,.25))}
.mark svg{width:100%;height:100%;display:block}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button:hover{background:var(--surface-2);color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* menu groups: hover (or tap) opens the group */
.tgrp{position:relative}
.tabs .tg-h.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tg-m{display:none;position:absolute;top:100%;inset-inline-start:0;z-index:60;min-width:180px;flex-direction:column;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tgrp.open .tg-m{display:flex}
@media (hover:hover){.tgrp:hover .tg-m{display:flex}}
.tg-m button,.tg-m .tg-a{text-align:start;white-space:nowrap}
.tg-a{display:block;padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.tg-a:hover{background:var(--surface-2);color:var(--fg)}
.top .spacer{flex:1}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}

/* controls */
.btn,button.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn.icon{padding:4px 7px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0;flex:none}
input[type=color]{padding:2px;height:34px;width:56px}
textarea{resize:vertical;min-height:64px;line-height:1.7}
input.num,input.ltr{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--fg)}
label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.inline{display:flex;gap:6px;align-items:center;min-width:0}
.inline > input,.inline > select{flex:1}
.grid{display:grid;gap:10px 14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span-all{grid-column:1/-1}
small.note{font-size:12px;color:var(--muted);display:block;min-height:1em}
small.note.warn{color:var(--warn)}small.note.err{color:var(--danger)}small.note.ok{color:var(--ok)}

/* layout */
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:1640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3{font-size:15px;font-weight:700}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-right:6px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.ed{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ed-head h2{font-size:19px;font-weight:800}
.ed-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.draft{background:var(--warn-soft);color:var(--warn);border-color:transparent}
tr.doc-kid>td{background:var(--surface-2);font-size:.95em}tr.doc-kid>td:nth-child(2){padding-inline-start:22px}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}.th-sort:hover,.th-sort.on{color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.preview-col{position:sticky;top:72px;display:flex;flex-direction:column;gap:10px;min-width:0}
.preview-col .card{padding:12px}
.pv-wrap{position:relative;overflow:hidden;border-radius:4px}
.pv-scale{width:794px;transform-origin:top right;display:flex;flex-direction:column;gap:18px}
.pv-scale .paper{box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08)}
.pv-bg{background:var(--surface-2);border-radius:10px;padding:14px;max-height:calc(100vh - 170px);overflow:auto}
.notice{border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.ref-card{border-color:var(--accent)}
.ref-sum{font-size:13px;color:var(--muted);line-height:1.9}
.ref-sum b{color:var(--fg)}
.ref-star{color:var(--warn)}
.pill.btnpill{cursor:pointer;font:inherit;font-size:12px}
.pill.btnpill:hover{border-color:var(--accent)}
.pv-lab{font:700 20px/1.4 var(--ui);color:var(--fg);display:flex;align-items:center;gap:10px;margin-bottom:-8px}
.pv-lab i{width:14px;height:14px;border-radius:50%;display:inline-block}
.pv-skip{opacity:.6}
.it.ovr{min-width:0!important;width:100%;table-layout:fixed}.it.ovr th:first-child{width:30px}.it.ovr th:last-child{width:44px}.it.ovr td{vertical-align:middle}.it.ovr input{width:100%}
.it.ovr .ovr-orig{color:var(--muted);font-size:13px}
.pv-skipwrap{opacity:.4}
.plan-row{flex-wrap:wrap}
.plan-row select.pr-limited{border-color:var(--accent);color:var(--accent);background:var(--surface);font-weight:600}
.pv-lab small{font-weight:500;color:var(--muted);font-size:17px}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.plan-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface-2)}
.plan-row .dot{width:11px;height:11px;border-radius:50%;flex:none}
.plan-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.plan-row select{width:auto;min-width:0;flex:none;max-width:60%;padding:3px 6px;font-size:13px}
.plan-row.ref{border-color:var(--accent);background:var(--accent-soft)}
.diff-up{color:var(--danger)}.diff-down{color:var(--ok)}
.sub-h{font-weight:700;color:var(--fg);font-size:13.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* item table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.it{width:100%;border-collapse:collapse;min-width:960px}
table.it th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
table.it td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.it tr:last-child td{border-bottom:0}
table.it td.rn{text-align:center;color:var(--muted);padding-top:10px;width:32px}
table.it input{padding:4px 6px}
table.it input.sub{margin-top:4px;font-size:12.5px;background:transparent;border-style:dashed}
table.it td.amt{text-align:left;direction:ltr;padding-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
table.it td.c{text-align:center;padding-top:10px}
table.it td.act{white-space:nowrap;padding-top:6px}
table.it .w-name{min-width:220px}
.it-dis{display:flex;gap:4px}.it-dis select{width:64px;flex:none;padding:4px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 14px}
.sum .v{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.sum .grand{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:6px;color:var(--accent)}
.words{font-size:13px;color:var(--muted)}
.fxnote{display:block;font-size:11.5px;color:var(--accent);margin-top:2px}

/* lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.toolbar .spacer{flex:1}
table.list{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.list th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.list td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:hover td{background:var(--surface-2)}
table.list td.n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
table.list .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* companies */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600}
.chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.co-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:0;background:var(--surface);min-width:0}
legend{font-weight:700;padding:0 6px;font-size:14px}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.imgbox{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12.5px;color:var(--muted)}
.imgbox .thumb{height:70px;width:100%;display:grid;place-items:center;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/14px 14px;border-radius:6px}
.imgbox img{max-height:66px;max-width:100%}
.example{font-size:12.5px;color:var(--muted)}
.example b{direction:ltr;unicode-bidi:isolate;color:var(--fg)}

/* modal, toast, date picker */
.modal{position:fixed;inset:0;background:rgba(10,15,14,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal-box{background:var(--surface);border-radius:14px;width:min(1100px,100%);display:flex;flex-direction:column;gap:12px;padding:14px 16px;box-shadow:var(--shadow)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:60;font-size:13.5px;max-width:calc(100vw - 32px)}
.dp{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:286px}
.dp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-g .wd{font-size:11px;color:var(--muted);padding:2px 0}
.dp-g button{border:0;background:none;border-radius:7px;padding:5px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.dp-g button:hover{background:var(--surface-2)}
.dp-g button.hol{color:var(--danger)}
.dp-g button.sel{background:var(--accent);color:var(--accent-ink)}
.dp-g button.today{box-shadow:inset 0 0 0 1px var(--accent)}
.dp-f{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted);gap:6px}
.hol-list{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.hol-list span:nth-child(odd){font-variant-numeric:tabular-nums;color:var(--muted)}

@media (max-width:1100px){.ed,.co-wrap{grid-template-columns:minmax(0,1fr)}.preview-col{position:static}.pv-bg{max-height:none}}
@media (max-width:640px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.span3{grid-column:1/-1}.imgs{grid-template-columns:minmax(0,1fr)}.brand small{display:none}}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button,.chip{transition:background .15s,border-color .15s}}

/* theme toggle, version & changes */
#themeBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chg{display:flex;flex-direction:column;gap:12px}
.chg-v{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.chg-v.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chg-v.new{border-color:var(--ok)}
.chg-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chg-h b{font-size:15px}.chg-h .muted{color:var(--muted);font-size:12.5px}
.chg-v ul{margin:0;padding-inline-start:20px;font-size:13.5px;line-height:1.9}
/* lock screen */
body.locked>header,body.locked>main,body.locked #banner{visibility:hidden}
#lockScr{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.lock-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.lock-box h2{margin:0;font-size:19px}.lock-box p{margin:0;font-size:13.5px;line-height:1.9}.lock-box .muted{color:var(--muted);font-size:12.5px}
.lock-brand{display:flex;align-items:center;gap:10px;font-size:16px}.lock-brand .brand-ico{width:40px;height:40px;display:block}.lock-brand .brand-ico svg{width:100%;height:100%;stroke:none}

.lock-alt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.lock-code{direction:ltr;text-align:center;font:700 19px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--surface-2);border-radius:8px;padding:12px;user-select:all}
/* address labels designer */
.lb-wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1100px){.lb-wrap{grid-template-columns:minmax(0,1fr)}}
.lb-stage{background:var(--surface-2);border-radius:10px;padding:12px;overflow:auto;position:relative}
.lb-zoom{transform-origin:top left}
.lb-canvas{position:relative;background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.08);overflow:hidden;direction:ltr}
.lb-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(30,90,85,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(30,90,85,.09) 1px,transparent 1px);background-size:5mm 5mm;pointer-events:none}
.lb-el{position:absolute;box-sizing:border-box}
#lbStage .lb-el{cursor:move;outline:1px dashed rgba(30,90,85,.35);touch-action:none;user-select:none}
#lbStage .lb-el.sel{outline:2px solid #1e5a55;z-index:5}
.lb-el .lb-h{display:none;position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:#1e5a55;border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none}
#lbStage .lb-el.sel .lb-h{display:block}
.lb-text{width:100%;height:100%;direction:rtl;white-space:pre-line;line-height:1.5;overflow:hidden;display:flex;flex-direction:column}
.lb-logo img{width:100%;height:100%;object-fit:contain;display:block}
.lb-ph{display:grid;place-items:center;width:100%;height:100%;color:#7d8c87;font:11px Vazirmatn,Tahoma,sans-serif;background:repeating-linear-gradient(45deg,#f1f4f2 0 6px,#fff 6px 12px)}
.lb-custs{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px}
.lb-custs label.chk{align-items:flex-start;padding:4px 6px;border-radius:8px}
.lb-custs label.chk:hover{background:var(--surface-2)}
.lb-page{position:relative;overflow:hidden;background:#fff;break-after:page}

/* app UI: fonts, quotes, image sliders, stamp prompt, bank accounts */
.font-samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:12px 0 6px}
.font-sample{all:unset;cursor:pointer;border:1px solid var(--line,#dde3e0);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.font-sample b{font-size:16px;font-weight:700}
.font-sample span{font-size:13px;opacity:.85}
.font-sample[aria-pressed="true"]{border-color:var(--accent,#1e5a55);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#1e5a55) 25%,transparent)}
.font-sample:focus-visible{outline:2px solid var(--accent,#1e5a55)}
.qlist{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line,#e3e8e6);padding:6px 2px}
.qrow .qtx{flex:1;line-height:1.8}
.qrow .qar{font-family:'Amiri','Noto Naskh Arabic',inherit;font-size:1.08em}
.img-adj{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin-top:12px}
.f.rng input[type=range]{width:100%;accent-color:var(--accent,#1e5a55);padding:0;background:none;border:0}
.f.rng output{font-weight:600;color:var(--accent,#1e5a55)}
.seal-row{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border:1px solid var(--line,#dde3e0);border-radius:10px;padding:8px 12px}
.seal-co{flex:1;min-width:160px;display:flex;align-items:center;gap:8px}
.seal-co .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.seal-opt{display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line,#dde3e0);border-radius:8px;padding:4px 10px;background:var(--surface)}
.seal-opt img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:4px}
.seal-opt.off{opacity:.55;cursor:default}
.list td.who{white-space:nowrap;font-size:12.5px;line-height:1.5}
.home-hero{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.hm-greet{font-size:20px;font-weight:800}
.hm-date{font-size:16px;font-weight:700}
.hm-sub{font-size:13px;color:var(--muted)}
.hm-clock{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--accent)}
.hm-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:left}
.hm-login{font-size:12.5px;color:var(--muted)}
table.list.hm-list{min-width:0}
.hm-list td.hn{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:800}
.kpi .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.home-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.home-cols{grid-template-columns:1fr}.hm-side{align-items:flex-start;text-align:right}}
.todo{display:flex;flex-direction:column;gap:6px}
.todo-i{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px}
.todo-i.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.todo-i.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.menu-card{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:3px}
.menu-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.menu-card b{font-size:15px}
.menu-card small{color:var(--muted);font-size:12.5px;line-height:1.6}
.dossier{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note-i{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.note-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.note-h .btn{padding:1px 8px;font-size:11.5px}
.note-t{white-space:pre-wrap;font-size:13.5px;margin-top:2px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gal-card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.gal-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.gal-pic{position:relative;display:block;height:140px;background:var(--surface-2);cursor:pointer}
.gal-pic img{width:100%;height:100%;object-fit:cover;display:block}
.gal-pic input{position:absolute;top:8px;right:8px;width:20px;height:20px}
.gal-ic{height:100%;display:grid;place-items:center;font:800 24px system-ui;color:var(--accent)}
.gal-badge{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;border-radius:6px;padding:1px 7px}
.gal-badge.warn{background:#9a5a0b}
.gal-cap{padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gal-cap b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
a.btn:not(.pri){color:var(--fg)}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pb-card.org{border-inline-start:4px solid var(--accent)}
.pb-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pb-name{font-size:15px}
.pb-sub{font-size:12.5px;color:var(--muted)}
.pb-nums{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.pb-num{color:var(--accent);text-decoration:none;font-weight:600}
.ce-p{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface-2)}
.xf-panel{position:fixed;left:14px;bottom:14px;z-index:60;width:min(420px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow),0 8px 30px rgba(0,0,0,.15);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.xf-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.xf-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.xf-row{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:6px}
.xf-n{display:flex;justify-content:space-between;gap:8px;font-size:13px}.xf-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xf-bar{height:7px;background:var(--surface-2);border-radius:9px;overflow:hidden}.xf-bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.xf-row.err .xf-bar i{background:var(--danger)}.xf-row.pause .xf-bar i{background:var(--warn)}.xf-row.ok .xf-bar i{background:var(--ok)}
.xf-s{display:flex;justify-content:space-between;align-items:center;gap:6px}.xf-s small{color:var(--muted)}.xf-row.err .xf-s small{color:var(--danger)}
.xf-s .btn{padding:1px 8px;font-size:12px}
.sh-pin{font-size:16px;letter-spacing:.18em;font-variant-numeric:tabular-nums;user-select:all}
.bank-card{border:1px solid var(--line,#dde3e0);border-radius:10px;padding:10px 12px;background:var(--bg2,transparent)}
.bank-card .card-h{margin-bottom:6px}
/* ============ PAPER (print-true) ============ */
.paper{width:210mm;min-height:297mm;background:#fff;color:#1c1c1c;position:relative;box-sizing:border-box;padding:12mm 12mm 10mm;font-family:var(--fb),Tahoma,sans-serif;font-size:var(--fs);line-height:1.65;display:flex;flex-direction:column;gap:3.2mm;direction:rtl;text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.paper *{box-sizing:border-box}
.paper h1,.paper h2,.paper h3{font-family:var(--ft),var(--fb),Tahoma,sans-serif;margin:0;font-weight:700;line-height:1.35}
.paper p{margin:0}
.paper .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.paper .num{font-variant-numeric:tabular-nums}
.paper table.items{width:100%;border-collapse:collapse}
.paper .items thead{display:table-header-group}
.paper .items tr{break-inside:avoid}
.paper .items th,.paper .items td{padding:1.4mm 1.8mm;vertical-align:top}
.paper .items .n{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.paper .items .m{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.paper .items .iimg{float:right;width:13mm;height:13mm;object-fit:contain;margin:0 0 .5mm 2mm;border-radius:1mm}
.paper .items .idesc{font-size:.84em;color:#5a5a5a;margin-top:.4mm;white-space:pre-line}
.paper .kv{font-size:.95em}
.paper .kv span{color:#666}
.paper .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--ft),var(--fb),sans-serif;font-size:34mm;color:var(--c);opacity:.055;transform:rotate(-24deg);white-space:nowrap;z-index:0}
.paper > *{position:relative;z-index:1}
.paper .signs{display:grid;grid-template-columns:1fr 1fr;gap:6mm;break-inside:avoid}
.paper .signs.has-qr{grid-template-columns:24mm 1fr 1fr;gap:4mm}
.paper .vqr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6mm;font-size:.68em;line-height:1.35;color:#444;text-align:center}
.paper .vqr svg{width:22mm;height:22mm;display:block}
.paper .sign{min-height:max(30mm,calc(27mm * var(--sts,1) + 6mm),calc(15mm * var(--sgs,1) + 10mm));position:relative;padding:1.8mm 3mm;font-size:.9em}
.paper .sign .lab{position:relative;z-index:2}
.paper .sign img.stamp{position:absolute;max-height:calc(27mm * var(--sts,1));max-width:calc(40mm * var(--sts,1));left:50%;top:55%;transform:translate(calc(-50% + var(--stx,0mm)),calc(-50% + var(--sty,0mm))) rotate(var(--str,-7deg));opacity:.93}
.paper .sign img.sig{position:absolute;max-height:calc(15mm * var(--sgs,1));max-width:calc(34mm * var(--sgs,1));left:22%;top:58%;transform:translate(calc(-50% + var(--sgx,0mm)),calc(-50% + var(--sgy,0mm)))}
.paper .notes{white-space:pre-line;font-size:.92em}
.paper .notes b{display:block;font-family:var(--ft),var(--fb),sans-serif;margin-bottom:.4mm}
.paper .bank{font-size:.9em;display:flex;flex-wrap:wrap;gap:.6mm 5mm}
.paper .bank span{color:#666}
.paper .bank .acc{display:contents}
.paper .bank.multi{flex-direction:column;gap:1mm}
.paper .bank.multi .acc{display:flex;flex-wrap:wrap;gap:.4mm 5mm}
.paper .bank.multi .acc+.acc{border-top:.2mm dashed #bbb;padding-top:1mm}
.paper .fq-ar{font-family:'Amiri','Noto Naskh Arabic',var(--fb);font-size:1.08em}
.paper .fq-ref{opacity:.75;font-size:.92em;white-space:nowrap}
.paper .valid{font-size:.92em;font-weight:600;color:var(--c)}
.paper .push{margin-top:auto}
/* a little too tall for one sheet: tighter spacing (and smaller text, set by the layout code) */
.paper.pg-fit{gap:2.2mm;padding-top:9mm;padding-bottom:8mm}
.paper.pg-fit .items th,.paper.pg-fit .items td{padding-top:.8mm;padding-bottom:.8mm}
.paper.pg-fit .sign{min-height:max(24mm,calc(24mm * var(--sts,1) + 3mm),calc(13mm * var(--sgs,1) + 8mm))}
.t-band.pg-fit{padding:0;gap:0}.t-band.pg-fit .b-band{padding-top:7mm;padding-bottom:5mm}.t-band.pg-fit .b-body{gap:3mm;padding-top:4.5mm;padding-bottom:4.5mm}
.t-min.pg-fit{padding:11mm 16mm 9mm;gap:3.6mm}
.t-frame.pg-fit{padding:8mm}.t-frame.pg-fit .fr-in{gap:2.2mm;padding:5mm 6mm 4mm}
.paper .items tr.pg-carry td{font-weight:700;background:#f3f3f3}
.paper .items tr.pg-carry td.l{text-align:left}
.paper .pg-cont{text-align:center;font-weight:700;font-size:.9em;color:var(--c);border:.25mm dashed currentColor;border-radius:1.5mm;padding:.8mm 2mm;break-inside:avoid}
.paper .pg-no{text-align:center;font-size:.8em;color:#555;line-height:1.4}
.t-band .pg-no{background:color-mix(in srgb,var(--c) 10%,#fff);padding:0 12mm 2.6mm;margin-top:-.1mm}
.t-frame .pg-no{margin-top:-1.6mm}

/* T1 formal */
.t-formal{--line:#2a2a2a}
.t-formal .f-head{display:grid;grid-template-columns:34mm 1fr 50mm;align-items:center;gap:4mm}
.t-formal .f-logo{display:flex;align-items:center;justify-content:flex-start}
.t-formal .f-logo img{max-height:calc(24mm * var(--lgs,1));max-width:calc(34mm * var(--lgs,1))}
.t-formal .f-title{text-align:center}
.t-formal .f-title h1{font-size:1.7em;color:var(--c)}
.t-formal .f-co{font-family:var(--ft),var(--fb),sans-serif;font-size:1.12em;font-weight:700}
.t-formal .f-sub{font-size:.85em;color:#555}
.t-formal table.f-meta{border-collapse:collapse;width:100%;font-size:.92em}
.t-formal .f-meta th,.t-formal .f-meta td{border:.25mm solid var(--line);padding:.8mm 2mm}
.t-formal .f-meta th{background:#efefef;font-weight:600;width:40%;text-align:right}
.t-formal .f-box{display:flex;border:.25mm solid var(--line);break-inside:avoid}
.t-formal .f-cap{writing-mode:vertical-rl;background:color-mix(in srgb,var(--c) 13%,#fff);border-left:.25mm solid var(--line);padding:2mm 1.2mm;font-weight:700;text-align:center;font-size:.86em;font-family:var(--ft),var(--fb),sans-serif}
.t-formal .f-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:.5mm 4mm;padding:1.8mm 3mm}
.t-formal .f-grid .wide{grid-column:1/-1}
.t-formal .f-strip{border:.25mm solid var(--line);border-bottom:0;background:color-mix(in srgb,var(--c) 13%,#fff);text-align:center;font-weight:700;padding:.8mm;font-family:var(--ft),var(--fb),sans-serif;margin-bottom:-3.2mm}
.t-formal .items th,.t-formal .items td{border:.25mm solid var(--line)}
.t-formal .items thead th{background:#ececec;font-weight:700;font-size:.88em;text-align:center}
.t-formal .items tfoot td{font-weight:600}
.t-formal .items tfoot td.l{text-align:left}
.t-formal .items tfoot tr.grand td{background:color-mix(in srgb,var(--c) 13%,#fff);font-weight:800}
.t-formal .f-words{border:.25mm solid var(--line);padding:1.4mm 3mm;font-weight:600}
.t-formal .f-notes{border:.25mm solid var(--line);padding:1.6mm 3mm;display:flex;flex-direction:column;gap:1.4mm}
.t-formal .sign{border:.25mm solid var(--line);text-align:center}
.t-off .off-items{font-size:.68em;table-layout:fixed}.t-off .off-items thead th{font-size:.95em;line-height:1.3;padding:.8mm .5mm;white-space:normal!important;vertical-align:middle}.t-off .off-items td{padding:.9mm .6mm;overflow-wrap:anywhere}.t-off .off-items td.m{white-space:nowrap;overflow:hidden}.t-off .f-grid{grid-template-columns:repeat(3,1fr)}
.t-formal .f-foot{border-top:.25mm solid var(--line);text-align:center;font-size:.8em;color:#444;padding-top:1.4mm}

/* T2 band */
.t-band{padding:0;gap:0}
.t-band .b-band{background:var(--c);color:#fff;padding:9mm 12mm 7mm;display:flex;justify-content:space-between;align-items:center;gap:6mm}
.t-band .b-brand{display:flex;align-items:center;gap:4mm;min-width:0}
.t-band .b-logo{width:calc(22mm * var(--lgs,1));height:calc(22mm * var(--lgs,1));border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--c);font-family:var(--ft),var(--fb),sans-serif;font-size:2.2em}
.t-band .b-logo img{max-width:calc(16mm * var(--lgs,1));max-height:calc(16mm * var(--lgs,1))}
.t-band h1{font-size:1.85em;line-height:1.2}
.t-band .b-slogan{opacity:.85;font-size:.9em}
.t-band .b-doc{text-align:left;flex:none}
.t-band .b-type{font-family:var(--ft),var(--fb),sans-serif;font-size:1.4em;font-weight:700}
.t-band .b-pills{display:flex;flex-direction:column;align-items:flex-end;gap:1.2mm;margin-top:1.6mm}
.t-band .b-pills span{background:rgba(255,255,255,.17);border-radius:10mm;padding:.4mm 3.2mm;font-size:.88em;white-space:nowrap}
.t-band .b-body{padding:6mm 12mm 6mm;display:flex;flex-direction:column;gap:4mm;flex:1}
.t-band .b-parties{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.t-band .b-party{border-top:.8mm solid var(--c);padding-top:2mm;display:flex;flex-direction:column;gap:.3mm}
.t-band .b-party h3{font-size:1em;color:var(--c);margin-bottom:.8mm}
.t-band .b-party .nm{font-weight:700;font-size:1.05em}
.t-band .items thead th{color:var(--c);border-bottom:.5mm solid var(--c);font-weight:700;text-align:right;font-size:.9em}
.t-band .items thead th.n{text-align:center}.t-band .items thead th.m{text-align:left}
.t-band .items tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--c) 6%,#fff)}
.t-band .items td{border-bottom:.2mm solid #e2e2e2}
.t-band .b-sum{display:grid;grid-template-columns:1fr 72mm;gap:7mm;align-items:start;break-inside:avoid}
.t-band .b-left{display:flex;flex-direction:column;gap:2.4mm}
.t-band .b-totals .row{display:flex;justify-content:space-between;gap:4mm;padding:.9mm 1mm;border-bottom:.2mm solid #e5e5e5}
.t-band .b-totals .row b{font-variant-numeric:tabular-nums;direction:ltr}
.t-band .b-totals .grand{background:var(--c);color:#fff;padding:2mm 3mm;border-radius:2mm;margin-top:1.5mm;font-weight:800;border:0}
.t-band .b-words{font-weight:600;font-size:.92em}
.t-band .sign{border:.3mm dashed #b8b8b8;border-radius:2mm}
.t-band .b-foot{background:color-mix(in srgb,var(--c) 10%,#fff);padding:3mm 12mm;font-size:.8em;color:#333;display:flex;justify-content:space-between;gap:2mm 5mm;flex-wrap:wrap;margin-top:auto}

/* T3 minimal */
.t-min{padding:15mm 16mm 11mm;gap:5mm}
.t-min .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm}
.t-min .m-name{font-family:var(--ft),var(--fb),sans-serif;font-size:2em;line-height:1.15;color:#111;font-weight:700}
.t-min .m-sub{color:var(--c);font-size:.95em}
.t-min .m-contact{color:#666;font-size:.84em;margin-top:1mm}
.t-min .m-logo img{max-height:calc(20mm * var(--lgs,1));max-width:calc(42mm * var(--lgs,1))}
.t-min .m-titlerow{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;border-top:.35mm solid #111;border-bottom:.15mm solid #bdbdbd;padding:2mm 0;flex-wrap:wrap}
.t-min .m-title{font-family:var(--ft),var(--fb),sans-serif;font-size:1.4em;color:var(--c);font-weight:700}
.t-min .m-meta{display:flex;gap:6mm;font-size:.92em;flex-wrap:wrap}
.t-min .m-meta span{color:#777}
.t-min .m-parties{display:grid;grid-template-columns:1.15fr 1fr;gap:9mm}
.t-min .m-lab{font-size:.78em;color:#8a8a8a;letter-spacing:.04em;margin-bottom:.6mm}
.t-min .m-party .nm{font-size:1.12em;font-weight:700;display:block;margin-bottom:.4mm}
.t-min .kv{font-size:.9em;color:#333}
.t-min .items thead th{font-weight:600;color:#777;font-size:.84em;border-bottom:.35mm solid #111;text-align:right}
.t-min .items thead th.n{text-align:center}.t-min .items thead th.m{text-align:left}
.t-min .items td{border-bottom:.15mm solid #dcdcdc}
.t-min .m-sum{display:grid;grid-template-columns:1fr 78mm;gap:9mm;align-items:start;break-inside:avoid}
.t-min .m-totals .row{display:flex;justify-content:space-between;gap:4mm;padding:.8mm 0}
.t-min .m-totals .row b{font-variant-numeric:tabular-nums;font-weight:500;direction:ltr}
.t-min .m-totals .grand{border-top:.35mm solid #111;margin-top:1mm;padding-top:2mm;font-size:1.18em;color:var(--c)}
.t-min .m-totals .grand b{font-weight:800}
.t-min .m-words{font-size:.9em;color:#333;border-right:.8mm solid var(--c);padding-right:3mm}
.t-min .sign{border-top:.2mm solid #999;padding-top:1.4mm;font-size:.84em;color:#666}
.t-min .m-foot{text-align:center;font-size:.78em;color:#888;margin-top:auto}

/* T4 frame */
.t-frame{padding:8mm}
.t-frame .fr-in{border:1.2mm double var(--c);flex:1;display:flex;flex-direction:column;gap:3.4mm;padding:6mm 7mm 5mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.t-frame .fr-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6mm}
.t-frame .fr-head img{max-height:calc(19mm * var(--lgs,1));max-width:calc(50mm * var(--lgs,1))}
.t-frame .fr-name{font-family:var(--ft),var(--fb),sans-serif;font-size:1.6em;font-weight:700}
.t-frame .fr-sub{font-size:.88em;color:#555}
.t-frame .fr-label{display:inline-block;border:.35mm solid var(--c);color:var(--c);padding:.3mm 9mm;border-radius:6mm;font-family:var(--ft),var(--fb),sans-serif;font-size:1.12em;font-weight:700;margin-top:1mm}
.t-frame .fr-meta{display:flex;border:.3mm solid #9a9a9a;border-radius:2mm;overflow:hidden}
.t-frame .fr-meta div{flex:1;padding:1.1mm 3mm;border-left:.3mm solid #9a9a9a;text-align:center}
.t-frame .fr-meta div:last-child{border-left:0}
.t-frame .fr-meta span{color:#666}
.t-frame .fr-parties{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.t-frame .fr-box{border:.3mm solid #9a9a9a;border-radius:2.5mm;padding:3.4mm 3.5mm 2mm;position:relative;break-inside:avoid}
.t-frame .fr-box h3{position:absolute;top:-2.9mm;right:4mm;background:#fff;padding:0 2mm;font-size:.92em;color:var(--c)}
.t-frame .fr-box .nm{font-weight:700}
.t-frame .items{border:.4mm solid var(--c)}
.t-frame .items thead th{background:var(--c);color:#fff;font-weight:600;font-size:.88em;text-align:center}
.t-frame .items td{border:.2mm solid #bbb}
.t-frame .fr-bottom{display:grid;grid-template-columns:1fr 74mm;gap:4mm;align-items:start;break-inside:avoid}
.t-frame .fr-left{display:flex;flex-direction:column;gap:2mm}
.t-frame .fr-totals{border:.3mm solid #9a9a9a;border-radius:2mm;overflow:hidden}
.t-frame .fr-totals .row{display:flex;justify-content:space-between;gap:4mm;padding:1mm 3mm;border-bottom:.2mm solid #ddd}
.t-frame .fr-totals .row b{font-variant-numeric:tabular-nums;direction:ltr}
.t-frame .fr-totals .grand{background:color-mix(in srgb,var(--c) 13%,#fff);font-weight:800;border-bottom:0}
.t-frame .fr-words{border:.3mm dashed #9a9a9a;border-radius:2mm;padding:1.4mm 3mm;font-weight:600;font-size:.92em}
.t-frame .sign{border:.3mm solid #9a9a9a;border-radius:2mm;text-align:center}
.t-frame .fr-foot{margin-top:auto;text-align:center;font-size:.8em;color:#444;border-top:.3mm solid var(--c);padding-top:1.4mm}

/* print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .paper{box-shadow:none;margin:0;min-height:296mm;break-after:page}
  #printArea .paper:last-child,#printArea .lb-page:last-child{break-after:auto}
  #printArea .lb-canvas{box-shadow:none}
}
</style>

/*CORE-START*/
'use strict';
/* ---------- Jalali calendar (jalaali algorithm) ---------- */
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
const JBREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  let bl=JBREAKS.length,gy=jy+621,leapJ=-14,jp=JBREAKS[0],jm,jump=0,leap,leapG,march,n,i;

}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1;const gm=mod(div(i,153),12)+1;const gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){

/* ---------- holidays ---------- */
let HOL={fixed:{},dated:{}};
function parseHolidayText(fixedTxt,datedTxt){
  const h={fixed:{},dated:{}};
  for(const line of String(fixedTxt||'').split('\n')){const m=normDigits(line).trim().match(/^(\d{1,2})\/(\d{1,2})\s*(.*)$/);if(m)h.fixed[pad2(m[1])+'/'+pad2(m[2])]=(m[3]||'تعطیل رسمی').trim()}
  for(const line of String(datedTxt||'').split('\n')){const m=normDigits(line).trim().match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})\s*(.*)$/);if(m)h.dated[m[1]+'/'+pad2(m[2])+'/'+pad2(m[3])]=(m[4]||'تعطیل رسمی').trim()}
  return h;
}
function holidayInfo(jdn,cfg){
  const s=jStr(jdn);
  if(HOL.dated[s])return HOL.dated[s];
  if(HOL.fixed[s.slice(5)])return HOL.fixed[s.slice(5)];
  const w=pIdx(jdn);
  if(w===6)return 'جمعه';
  if(cfg&&cfg.thursdayOff&&w===5)return 'پنجشنبه';
  return null;
}
function shiftOff(jdn,dir,cfg){let k=0;while(holidayInfo(jdn,cfg)&&k<60){jdn+=dir;k++}return jdn}
function applyRule(jdn,cfg,forceDir){
  const info=holidayInfo(jdn,cfg);if(!info)return{jdn,note:'',kind:''};
  const rule=forceDir?(forceDir>0?'next':'prev'):(cfg.holidayRule||'next');
  if(rule==='warn')return{jdn,note:'این روز تعطیل است ('+info+').',kind:'warn'};
  const n=shiftOff(jdn,rule==='next'?1:-1,cfg);
  return{jdn:n,note:jStr(jdn)+' تعطیل است ('+info+')؛ تاریخ به '+jStr(n)+' ('+WD[pIdx(n)]+') منتقل شد.',kind:'info'};
}

/* ---------- numbers ---------- */
const W_ONES=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
const W_TEENS=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
const W_TENS=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
const W_HUND=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
const W_SCALE=['','هزار','میلیون','میلیارد','هزار میلیارد','میلیون میلیارد'];
function threeWords(n){const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(W_HUND[h]);if(r>=10&&r<20)p.push(W_TEENS[r-10]);else{const t=Math.floor(r/10),o=r%10;if(t)p.push(W_TENS[t]);if(o)p.push(W_ONES[o])}return p.join(' و ')}
function numWords(n){
  n=Math.floor(Math.abs(Number(n)||0));if(n===0)return 'صفر';
  const out=[];let i=0;
  while(n>0){const g=n%1000;if(g){let s=threeWords(g);if(W_SCALE[i])s+=' '+W_SCALE[i];out.unshift(s)}n=Math.floor(n/1000);i++}
  return out.join(' و ');
}
const CUR={IRR:{name:'ریال',sub:'',dec:0},IRT:{name:'تومان',sub:'',dec:0},USD:{name:'دلار',sub:'سنت',dec:2}};
function roundMoney(n,cur){const d=(CUR[cur]||CUR.IRR).dec;const f=Math.pow(10,d);return Math.round((Number(n)||0)*f+1e-9*Math.sign(n||0))/f}
function moneyWords(n,cur){

function fmtNum(n,dec,fa,minDec){

function parseNum(s){const v=parseFloat(normDigits(s).replace(/[٬,\s]/g,'').replace(/٫/g,'.').replace(/[^\d.\-]/g,''));return isFinite(v)?v:0}

/* ---------- totals ---------- */
/* rounding of the final amount: issued documents keep what they were issued with; drafts follow the settings */
function totalRoundNow(doc){const g=(typeof S!=='undefined'&&S&&S.global)||{};const m=g.totalRound||'fx';const cur=doc.currency||'IRR';if(m==='off'||cur==='USD')return null;
  if(m==='fx'&&!(doc.items||[]).some(i=>i.fx))return null;const u=(Number(g.fxRound)||1)/(cur==='IRT'?10:1);return u>1?{u,mode:g.totalRoundMode==='near'?'near':'down'}:null}

function calcDoc(doc){
  const cur=doc.currency||'IRR';const r=v=>roundMoney(v,cur);
  const lines=(doc.items||[]).map(it=>{
    const q=Number(it.qty)||0,p=Number(it.price)||0;const gross=r(q*p);

}

function allQuotes(){return QUOTES.concat((S&&S.quotes)||[])}
function quoteOn(q){return !((S&&S.quoteOff)||[]).includes(q.id)}
function quoteById(id){return id?allQuotes().find(q=>q.id===id)||null:null}
function quotePool(co){const cats=co&&Array.isArray(co.quoteCats)&&co.quoteCats.length?co.quoteCats:Object.keys(QCAT);return allQuotes().filter(q=>quoteOn(q)&&cats.includes(q.cat))}
function strHash(x){let h=2166136261;for(const ch of String(x)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pickQuote(co,seed){if(!co||co.footerMode==='text'||!co.footerMode)return '';if(co.quoteFixed&&quoteById(co.quoteFixed))return co.quoteFixed;const p=quotePool(co);if(!p.length)return '';return p[seed!=null?strHash(seed)%p.length:Math.floor(Math.random()*p.length)].id}
function docQuote(doc,co){if(!co||!co.footerMode||co.footerMode==='text')return null;if(co.quoteFixed){const f=quoteById(co.quoteFixed);if(f)return f}const q=quoteById(doc.quoteId);if(q)return q;const id=pickQuote(co,doc.id);return quoteById(id)}
function quoteHtml(q,co,D){if(!q)return '';const tr=co.quoteTr!==false;const ar=String(q.ar||'').trim();return `<span class="fq">${ar?`<span class="fq-ar">«${esc(ar)}»</span>`:''}${ar&&tr&&q.fa?' ':''}${(!ar||tr)&&q.fa?`<span class="fq-fa">${ar?'':'«'}${esc(q.fa)}${ar?'':'»'}</span>`:''} <span class="fq-ref">(${esc(D(q.ref||''))})</span></span>`}
function footHtml(c){const co=c.co;const m=co.footerMode||'text';const parts=[];if(m!=='quote'&&String(co.footerText||'').trim())parts.push(esc(co.footerText));if(m!=='text'){const q=docQuote(c.doc,co);if(q)parts.push(quoteHtml(q,co,c.D))}return parts.join('<br>')}

  {const refOf={};(st.batches||[]).forEach(b=>{if(b&&b.id)refOf[b.id]=b.refDocId});const MIG='تأیید پرداختِ ثبت‌شده پیش از نسخه‌ی ۲٫۲۰';
   st.documents.forEach(x=>{if(!x.batchId||!(x.batchId in refOf)||refOf[x.batchId]===x.id||!st.documents.some(y=>y.id===refOf[x.batchId]))return;x._fol=1;

}

let saveChain=Promise.resolve(),lastBlob=null;

}
function setSaveState(kind){

  if(SRV){if(kind==='saving'){el.className='pill';el.textContent='در حال ذخیره روی سرور…';return}if(kind==='conflict'){el.className='pill warn';el.textContent='ذخیره نشد: اطلاعات از جای دیگری تغییر کرده';return}if(kind==='err'){el.className='pill warn';el.textContent='ذخیره روی سرور ممکن نشد — دوباره تلاش می‌شود';clearTimeout(setSaveState._r);setSaveState._r=setTimeout(()=>srvSave(),8000);return}el.className='pill ok';el.textContent='ذخیره شد روی سرور · '+t;return}

/* converts what an older (unencrypted) version left in the folder, then deletes the readable files */
async function migrateFolderPlain(){
  if(!dirOk||!VAULT)return false;let changed=false;
  try{const old=JSON.parse(dec8.decode(await readBytes(dirHandle,DATA_FILE)));
    if(old&&old.app==='daftar-factor'&&(old.savedAt||0)>(S.savedAt||0)){S=migrate(old);refreshHolidays();curId=null}
    await dirHandle.removeEntry(DATA_FILE);changed=true}catch(e){}
  try{const bk=await dirHandle.getDirectoryHandle('backups');const names=[];for await(const [n,h] of bk.entries())if(h.kind==='file'&&/\.json$/i.test(n))names.push(n);
    for(const n of names){try{await writeBytes(bk,n.replace(/\.json$/i,'.data'),await aesEnc(VAULT.key,await readBytes(bk,n),'state'))}catch(e){}try{await bk.removeEntry(n)}catch(e){}changed=true}}catch(e){}
  try{const root=await dirHandle.getDirectoryHandle(DOCS_DIR);const found=[];
    for await(const [cn,ch] of root.entries()){if(ch.kind!=='directory')continue;const dirs=[ch];try{dirs.push(await ch.getDirectoryHandle(TRASH_DIR))}catch(e){}
      for(const d of dirs)for await(const [fn,fh] of d.entries()){if(fh.kind!=='file'||!/\.html?$/i.test(fn))continue;try{const pp=parseDocHtml(await (await fh.getFile()).text());if(pp&&!S.documents.some(x=>x.id===pp.doc.id)&&!S.trash.some(t=>t.doc.id===pp.doc.id))found.push(pp)}catch(e){}}}
    if(found.length)importDocs(found);
    await dirHandle.removeEntry(DOCS_DIR,{recursive:true});
    S.documents.forEach(d=>{d.savedPath=null;d.fileSig=''});S.trash.forEach(t=>{t.doc.savedPath=null});changed=true}catch(e){}
  if(changed){toast('فایل‌های بدون رمزِ نسخه‌ی قبلی در پوشه رمزنگاری و فایل‌های خوانا حذف شدند.',5000);saveNow()}
  return changed;
}

  else{let old=null;try{old=JSON.parse(dec8.decode(await readBytes(h,DATA_FILE)))}catch(e){}

    await migrateFolderPlain();await saveNow();await writeFolder();toast('پوشه متصل شد؛ از این به بعد همه‌چیز رمزشده در آن ذخیره می‌شود')}
  renderBanner();renderAll();setSaveState('ok');

async function importFiles(fileList){
  const files=[...fileList];let docsIn=[];
  for(const f of files){
    let buf;try{buf=new Uint8Array(await f.arrayBuffer())}catch(e){toast('فایل «'+f.name+'» خوانده نشد');continue}
    if(isBackup(buf)){
      if(!cryptoReady()){toast('رمزگشایی در این صفحه در دسترس نیست؛ نسخه‌ی تحت وب باید با https باز شود.',6000);return}
      for(let tries=0;tries<5;tries++){const p=await askPassword('باز کردن پشتیبان رمزشده','رمزی را که هنگام ساختن فایل «'+esc(f.name)+'» تعیین کردید وارد کنید.'+(tries?' <b style="color:var(--danger)">رمز قبلی اشتباه بود.</b>':''));if(!p)return;
        const d=await openBackup(buf,p);if(d){restoreAll(d);return}}
      toast('رمز پشتیبان اشتباه است.',4000);return;
    }
    if(isVBlob(buf)){
      if(SRV||!VAULT){toast('این فایل پشتیبانِ روزانه‌ی نسخه‌ی آفلاین است و فقط در همان برنامه باز می‌شود. برای جابه‌جایی بین نسخه‌ها از «پشتیبان رمزشده» استفاده کنید.',7000);continue}
      let d=null;try{d=await decState(buf)}catch(e){}
      if(!d){toast('این فایل با رمز دیگری رمزنگاری شده است.',4000);continue}
      if(restoreAll(d))return;continue;
    }
    if(buf[0]===0x50&&buf[1]===0x4b){
      let entries;try{entries=await readZip(buf)}catch(e){toast('فایل ZIP قابل خواندن نیست.',4000);continue}
      const dataE=entries.find(e=>e.name.split('/').pop()===DATA_FILE);
      if(dataE){let d;try{d=JSON.parse(new TextDecoder().decode(dataE.data))}catch(e){toast('فایل اطلاعات داخل ZIP خراب است.',4000);continue}
        if(restoreAll(d))return;continue}
      entries.filter(e=>/\.html?$/i.test(e.name)).forEach(e=>{const p=parseDocHtml(new TextDecoder().decode(e.data));if(p)docsIn.push(p)});continue;
    }
    const txt=new TextDecoder().decode(buf);
    if(/^\s*</.test(txt)){const p=parseDocHtml(txt);if(p)docsIn.push(p);else toast('«'+f.name+'» فایل سند «دفتر فاکتور» نیست.',4000);continue}
    let d;try{d=JSON.parse(txt)}catch(e){toast('این فایل قابل خواندن نیست؛ فایل پشتیبان همین برنامه را انتخاب کنید.',4000);continue}
    if(restoreAll(d))return;
  }
  if(docsIn.length)importDocs(docsIn);
}
function restoreAll(d){
  if(!d||!Array.isArray(d.companies)){toast('این فایل پشتیبان «دفتر فاکتور» نیست.',4000);return false}
  if(!confirm('همه‌ی اطلاعات فعلی با این پشتیبان جایگزین شود؟\n('+toFa(d.companies.length)+' شرکت، '+toFa((d.documents||[]).length)+' سند)'))return true;
  (d.documents||[]).forEach(x=>{x.savedPath=null;x.fileSig=''});(d.trash||[]).forEach(t=>{if(t.doc){t.doc.savedPath=null;t.doc.fileSig=''}});
  loadState(d);renderAll();toast('اطلاعات از پشتیبان بازگردانده شد');return true;
}
function importDocs(list){
  let added=0,replaced=0,skipped=0;
  for(const p of list){
    const raw=p.doc;let co=coById(raw.companyId)||(p.company&&S.companies.find(c=>c.name===p.company.name));
    if(!co){skipped++;continue}
    const d=fixDoc(raw);d.companyId=co.id;d.committed=true;d.batchId='';d.batchManual=false;d.savedPath=null;d.fileSig='';
    const ex=S.documents.findIndex(x=>x.id===d.id);
    if(ex>=0){if(list.length===1&&!confirm('این سند ('+TN(d.type)+' '+toFa(d.number)+') در برنامه هست. با نسخه‌ی فایل جایگزین شود؟'))return;S.documents[ex]=d;replaced++}
    else{S.trash=S.trash.filter(t=>t.doc.id!==d.id);S.documents.push(d);added++}
  }
  save();renderAll();
  toast((added?toFa(added)+' سند بازیابی شد. ':'')+(replaced?toFa(replaced)+' سند جایگزین شد. ':'')+(skipped?toFa(skipped)+' سند به خاطر نبودن شرکتش وارد نشد.':''),5000);
}

    if(!confirm(toFa(found.length)+' سند روی سرور پیدا شد که در برنامه نیست. بازیابی شوند؟'))return;importDocs(found);return}

      try{const j=JSON.parse(dec8.decode(await aesDec(VAULT.key,new Uint8Array(await (await fh.getFile()).arrayBuffer()),'file')));const p=parseDocHtml(j.content);if(p&&!S.documents.some(d=>d.id===p.doc.id))found.push(p)}catch(e){}}}

  if(!confirm(toFa(found.length)+' سند در پوشه‌ها پیدا شد که در برنامه نیست. بازیابی شوند؟'))return;
  importDocs(found);

async function writeDocFileNow(d,toTrash){
  await pgReady([d]);

  const parts=[DOCS_DIR,dir].concat(toTrash?[TRASH_DIR]:[]);let name=fileNameOf(d);

  const clash=n=>pool.some(x=>x.id!==d.id&&x.savedPath&&x.savedPath.name===n&&x.savedPath.parts.join('/')===parts.join('/'));

let docSyncing=false,docResync=false;
async function syncDocFiles(){
  if(!dirOk||!dirHandle||(!SRV&&!VAULT))return;if(docSyncing){docResync=true;return}docSyncing=true;let changed=false;
  try{
    const coSig={};S.companies.forEach(c=>coSig[c.id]=hstr(JSON.stringify(c))+hstr(JSON.stringify(cfgOf(c))));
    for(const d of S.documents){if(!d.committed)continue;
      const c=Object.assign({},d);delete c.savedPath;delete c.fileSig;const sig=hstr(JSON.stringify(c))+'.'+(coSig[d.companyId]||'')+'.'+fileNameOf(d);
      if(d.fileSig===sig&&d.savedPath&&!d.savedPath.trash)continue;
      try{await writeDocFile(d,false);d.fileSig=sig;changed=true}catch(e){}}
    for(const t of S.trash){const d=t.doc;if(d.savedPath&&d.savedPath.trash)continue;try{await writeDocFile(d,true);d.fileSig='';changed=true}catch(e){}}
  }finally{docSyncing=false}

}

function refTargetDate(src,doc){

function fxRate(){return Number(S&&S.fx&&S.fx.rate)||0}
/* rounding of prices converted from dollars (Settings → dollar rate → rounding) */
function fxRoundTo(v,cur){if(cur==='USD')return roundMoney(v,'USD');const u=(Number(S.global.fxRound)||1)/(cur==='IRT'?10:1);if(u>1&&v>0)v=Math.max(u,Math.round(v/u)*u);return roundMoney(v,cur)}
/* price of an item that came from dollars, recomputed from its stored dollar info */
function fxItemPrice(fx,cur,rate){const r=rate||fx.rate;const rial=(Number(fx.usd)||0)*r*(1+(Number(fx.markup)||0)/100);return fxRoundTo(cur==='IRT'?rial/10:rial,cur)}
function convertProductPrice(p,cur){
  const pc=p.currency||'IRR';const v=Number(p.price)||0;
  if(pc===cur)return{price:v,info:null};
  let rial,info=null;
  if(pc==='USD'){const rate=fxRate();if(!rate)return{price:0,missing:true};const mk=Number(p.markup)||0;rial=v*rate*(1+mk/100);info={usd:v,rate,markup:mk,at:(S.fx&&S.fx.at)||Date.now()}}
  else rial=pc==='IRT'?v*10:v;
  if(cur==='USD'){const rate=fxRate();return rate?{price:roundMoney(rial/rate,'USD'),info:null}:{price:0,missing:true}}
  let out=cur==='IRT'?rial/10:rial;
  if(info)return{price:fxRoundTo(out,cur),info};
  return{price:roundMoney(out,cur),info};
}
function applyProduct(it,p,doc){it.pid=p.id;

  else if(!it.price||it.fx){it.price=r.price;it.fx=r.info}
  if(p.unit)it.unit=p.unit;if(!it.desc&&p.desc)it.desc=p.desc;if(p.code&&!it.code)it.code=p.code;
}

const digitsOf=x=>normDigits(x||'').replace(/\D/g,'');
function nationalCodeOk(x){const v=digitsOf(x);if(!/^\d{10}$/.test(v)||/^(\d)\1{9}$/.test(v))return false;let sm=0;for(let i=0;i<9;i++)sm+=(+v[i])*(10-i);const r=sm%11;return r<2?+v[9]===r:+v[9]===11-r}
function legalIdOk(x){const v=digitsOf(x);if(!/^\d{11}$/.test(v))return false;const c=[29,27,23,19,17,29,27,23,19,17];const d=+v[9]+2;let sm=0;for(let i=0;i<10;i++)sm+=(+v[i]+d)*c[i];let r=sm%11;if(r===10)r=0;return r===+v[10]}

/* ---------- accounting (دفتر حسابداری) ----------
   1) A committed invoice gets «تأیید پرداخت» from you (separate from issuing it) → it waits for the deposit.
   2) You record the deposit (amount, date). Each deposit snapshots the partners' coefficients of that moment.
   3) Per Jalali month, deposits first cover that month's expenses (monthly salary/rent/... plus one-off purchases);
      what is left is credited to the partners in proportion to their coefficients. Expenses a month's deposits
      did not cover carry over to the next month.
   4) A payment to a partner is recorded as pending; after your approval (optionally with the bank receipt) it settles.
   Everything is computed again from these records, so editing or deleting a record always gives consistent totals.
   Amounts are in rials. */
const ACC_CAT={salary:'حقوق',rent:'اجاره',purchase:'خرید',other:'سایر'};
function accFix(a){a=a&&typeof a==='object'?a:{};return{partners:Array.isArray(a.partners)?a.partners:[],recurring:Array.isArray(a.recurring)?a.recurring:[],expenses:Array.isArray(a.expenses)?a.expenses:[],confirm:a.confirm&&typeof a.confirm==='object'?a.confirm:{},deposits:Array.isArray(a.deposits)?a.deposits:[],settles:Array.isArray(a.settles)?a.settles:[],carry:a.carry!==false,notes:a.notes&&typeof a.notes==='object'?a.notes:{},files:a.files&&typeof a.files==='object'?a.files:{}}}
function ACC(){if(!S.acc)S.acc=accFix(null);return S.acc}
function accMonth(date){const j=parseJ(date);if(j==null)return '';const x=d2j(j);return x.jy+'/'+pad2(x.jm)}
function accNextMonth(m){let [y,mm]=m.split('/').map(Number);mm++;if(mm>12){mm=1;y++}return y+'/'+pad2(mm)}
const ACC_MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function accMonthName(m){const [y,mm]=m.split('/').map(Number);return ACC_MN[mm-1]+' '+toFa(y)}
function rial(n){return fmtMoney(Math.round(n||0),'IRR',true)}
function accDocRial(d){const t=calcDoc(d).total;return d.currency==='IRT'?t*10:d.currency==='USD'?(S.fx&&S.fx.rate?t*S.fx.rate:0):t}
function accPaid(docId){return ACC().deposits.filter(x=>x.docId===docId).reduce((a,x)=>a+(+x.amount||0),0)}
function accMonthExpense(m){const A=ACC();let r=0;const items=[];
  A.recurring.forEach(x=>{if((x.from||'')<=m&&(!x.to||m<=x.to)){r+=+x.amount||0;items.push([x.title,x.cat,+x.amount||0,'ماهانه'])}});
  A.expenses.forEach(x=>{if(accMonth(x.date)===m){r+=+x.amount||0;items.push([x.title,x.cat,+x.amount||0,x.date])}});
  return{total:r,items}}
function accSplit(amount,shares){const ps=Object.entries(shares||{}).filter(x=>+x[1]>0);const out={};if(!ps.length||amount<=0)return out;
  const tot=ps.reduce((a,x)=>a+(+x[1]),0);let given=0;ps.forEach(([id,c])=>{const v=Math.floor(amount*(+c)/tot);out[id]=v;given+=v});
  const big=ps.slice().sort((a,b)=>b[1]-a[1])[0][0];out[big]+=amount-given;return out}
function accCalc(){
  const A=ACC();const cur=accMonth(jStr(todayJdn()));
  const deps=A.deposits.slice().sort((a,b)=>(parseJ(a.date)||0)-(parseJ(b.date)||0)||(a.at||0)-(b.at||0));
  const ms=[cur];deps.forEach(d=>ms.push(accMonth(d.date)));A.expenses.forEach(e=>ms.push(accMonth(e.date)));A.recurring.forEach(r=>r.from&&ms.push(r.from));
  let first=ms.filter(Boolean).sort()[0]||cur;const last=ms.filter(Boolean).sort().pop()>cur?ms.filter(Boolean).sort().pop():cur;
  const months=[];const credit={};const depRes={};let carry=0;let guard=0;
  for(let m=first;m<=last&&guard<600;m=accNextMonth(m),guard++){
    const ex=accMonthExpense(m);let bucket=ex.total+(A.carry?carry:0);const inMonth=deps.filter(d=>accMonth(d.date)===m);
    let income=0,toExp=0;const toP={};
    inMonth.forEach(d=>{const a=Math.max(0,+d.amount||0);income+=a;const e=Math.min(bucket,a);bucket-=e;toExp+=e;const sp=accSplit(a-e,d.shares);depRes[d.id]={exp:e,parts:sp};Object.entries(sp).forEach(([p,v])=>{toP[p]=(toP[p]||0)+v;credit[p]=(credit[p]||0)+v})});
    const open=m>=cur;
    months.push({m,expense:ex.total,items:ex.items,carryIn:A.carry?carry:0,income,toExp,toP,left:bucket,open});
    carry=open?0:bucket;
  }
  const settled={},pending={};A.settles.forEach(x=>{const t=x.status==='done'?settled:pending;t[x.partnerId]=(t[x.partnerId]||0)+(+x.amount||0)});
  return{months,credit,settled,pending,depRes,cur};
}

function readReceipt(file){
  return new Promise((res,rej)=>{
    if(!file){res('');return}
    if(file.type==='application/pdf'){if(file.size>1.5*1024*1024){rej(new Error('فایل PDF بزرگ‌تر از ۱٫۵ مگابایت است؛ عکس فیش را بفرستید.'));return}const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('فایل خوانده نشد'));r.readAsDataURL(file);return}
    if(!/^image\//.test(file.type)){rej(new Error('فقط عکس یا PDF فیش'));return}
    const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('عکس خوانده نشد'))};im.src=u;
  });
}

async function accAction(a,b){
  const A=ACC();const id=b.dataset.id;const num=sel=>Math.round(parseNum(normDigits(($(sel)||{}).value||''))||0);
  switch(a){
    case 'acc-tab':ACCV.tab=b.dataset.k;ACCV.dep=ACCV.pay='';break;
    case 'acc-confirm':accConfirm(id,true);return;
    case 'acc-unconfirm':accConfirm(id,false);return;
    case 'acc-depOpen':ACCV.dep=id;break;
    case 'acc-depCancel':ACCV.dep='';break;
    case 'acc-depSave':{const amt=num('#adAmt'),date=normDigits($('#adDate').value.trim());if(!(amt>0)){toast('مبلغ را بنویسید');return}if(parseJ(date)==null){toast('تاریخ را درست بنویسید');return}
      const shares={};A.partners.filter(p=>p.active!==false&&+p.coef>0).forEach(p=>shares[p.id]=+p.coef);
      A.deposits.push({id:uid(),docId:id,amount:amt,date,note:$('#adNote').value.trim(),at:nowTs(),by:curUser(),shares});ACCV.dep='';save();toast('واریز تأیید شد و میان هزینه‌ها و شرکا تقسیم شد.',4500);break}
    case 'acc-depDel':if(!confirm('این واریز حذف شود؟ سهم شرکا دوباره حساب می‌شود.'))return;A.deposits=A.deposits.filter(x=>x.id!==id);save();break;
    case 'acc-recAdd':{const title=$('#arTitle').value.trim(),amt=num('#arAmt'),from=normDigits($('#arFrom').value.trim());if(!title||!(amt>0)){toast('عنوان و مبلغ را بنویسید');return}if(!/^\d{4}\/\d{2}$/.test(from)){toast('«از ماه» را به شکل ۱۴۰۵/۰۸ بنویسید');return}
      A.recurring.push({id:uid(),title,cat:$('#arCat').value,amount:amt,from,to:''});save();break}
    case 'acc-recDel':if(!confirm('این هزینه‌ی ماهانه حذف شود؟ (برای ماه‌های گذشته هم حساب نمی‌شود؛ اگر فقط دیگر ادامه ندارد، «تا ماه» را بنویسید)'))return;A.recurring=A.recurring.filter(x=>x.id!==id);save();break;
    case 'acc-expAdd':{const title=$('#aeTitle').value.trim(),amt=num('#aeAmt'),date=normDigits($('#aeDate').value.trim());if(!title||!(amt>0)||parseJ(date)==null){toast('تاریخ، عنوان و مبلغ را بنویسید');return}
      A.expenses.push({id:uid(),date,title,cat:$('#aeCat').value,amount:amt,at:nowTs(),by:curUser()});save();break}
    case 'acc-expDel':if(!confirm('این هزینه حذف شود؟'))return;A.expenses=A.expenses.filter(x=>x.id!==id);save();break;
    case 'acc-pAdd':{const name=$('#anName').value.trim(),coef=parseNum(normDigits($('#anCoef').value));if(!name||!(coef>0)){toast('نام و ضریب شراکت را بنویسید');return}
      A.partners.push({id:uid(),name,coef,mobile:normDigits($('#anMob').value.trim()),active:true});save();break}
    case 'acc-pToggle':{const p=A.partners.find(x=>x.id===id);if(p){p.active=p.active===false;save()}break}
    case 'acc-payOpen':ACCV.pay=id;break;
    case 'acc-payCancel':ACCV.pay='';break;
    case 'acc-paySave':{const amt=num('#apAmt'),date=normDigits($('#apDate').value.trim());if(!(amt>0)||parseJ(date)==null){toast('مبلغ و تاریخ را بنویسید');return}

/* ---------- accounting: customer profiles and order dossiers ----------
   A customer is recognised by national id (if any) or by normalised name, so documents issued before the
   customer was saved in «مشتریان» still land in the same profile.
   Every order (document) and every customer has a dossier: any number of dated notes and attached files.
   Notes and the list of files live in the (encrypted) app data; file contents are stored separately,
   encrypted: web version on the server (data key), offline version in the data folder or this browser. */
function normName(s){return String(s||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏‎]/g,' ').replace(/\s+/g,' ').trim()}
function custKeyOf(x){const nid=normDigits(String(x&&x.nationalId||'')).replace(/\D/g,'');return nid.length>=8?'n:'+nid:'m:'+normName(x&&x.name)}
function accProfiles(){
  const map=new Map();
  const get=(k,src)=>{let p=map.get(k);if(!p){p={key:k,info:Object.assign({},src),docs:[],cust:null};map.set(k,p)}return p};
  S.customers.forEach(c=>{if(!normName(c.name))return;const p=get(custKeyOf(c),c);p.cust=c;p.info=Object.assign({},c)});
  S.documents.filter(d=>d.committed&&d.buyer&&normName(d.buyer.name)&&!batchMain(d)).forEach(d=>{const p=get(custKeyOf(d.buyer),d.buyer);p.docs.push(d);
    if(!p.cust){const b=d.buyer;Object.keys(b).forEach(k=>{if(String(b[k]||'').trim()&&!String(p.info[k]||'').trim())p.info[k]=b[k]})}});
  return [...map.values()];
}
function accProfileStats(p){
  const A=ACC();const sales=salesDocs();const ids=new Set(p.docs.map(d=>d.id));
  const allInv=sales.filter(d=>ids.has(d.id)&&d.type==='invoice');const inv=allInv.filter(d=>A.confirm[d.id]),pf=p.docs.filter(d=>d.type==='proforma');
  const invSum=inv.reduce((a,d)=>a+accDocRial(d),0);const conf=inv.filter(d=>A.confirm[d.id]);
  const confSum=conf.reduce((a,d)=>a+accDocRial(d),0);const recv=A.deposits.filter(x=>ids.has(x.docId)).reduce((a,x)=>a+(+x.amount||0),0);
  const dates=p.docs.map(d=>parseJ(d.date)).filter(x=>x!=null).sort((a,b)=>a-b);
  const notes=[...ids].reduce((a,id)=>a+((A.notes[id]||[]).length),0)+((A.notes['c:'+p.key]||[]).length);
  const files=[...ids].reduce((a,id)=>a+((A.files[id]||[]).length),0)+((A.files['c:'+p.key]||[]).length);
  return{inv,pf,invSum,pfSum:pf.reduce((a,d)=>a+accDocRial(d),0),conf,confSum,recv,due:Math.max(0,confSum-recv),notConf:allInv.filter(d=>!A.confirm[d.id]).reduce((a,d)=>a+accDocRial(d),0),notConfN:allInv.filter(d=>!A.confirm[d.id]).length,first:dates[0],last:dates[dates.length-1],notes,files};
}
function accDocState(d){const A=ACC();if(d.type!=='invoice')return['پیش‌فاکتور',''];if(!A.confirm[d.id])return['بدون تأیید خریدار — در حساب نیست','draft'];const t=accDocRial(d),p=accPaid(d.id);if(t&&p>=t)return['واریز کامل','ok'];if(p>0)return['واریز '+rial(p)+' از '+rial(t),'acc'];return['منتظر واریز','acc']}
function fmtSize(n){return n>=1048576?toFa((n/1048576).toFixed(1))+' مگابایت':toFa(Math.max(1,Math.round(n/1024)))+' کیلوبایت'}
/* -- attachment storage -- */
async function attPut(id,u8){
  if(SRV){await api('att_put',{id,data:b64(u8)});return}
  if(!VAULT)throw new Error('برنامه قفل است.');const enc=await aesEnc(VAULT.key,u8,'att');
  if(dirOk&&dirHandle){const dh=await getDir([FILES_DIR,'att'],true);await writeBytes(dh,id+'.att',enc);return}
  await idb.set('att:'+id,enc);
}
async function attGet(id){
  if(SRV)return unb64((await api('att_get',{id})).data);
  if(!VAULT)throw new Error('برنامه قفل است.');let enc=null;
  if(dirOk&&dirHandle){try{enc=await readBytes(await getDir([FILES_DIR,'att'],false),id+'.att')}catch(e){}}
  if(!enc){try{enc=await idb.get('att:'+id)}catch(e){}}
  if(!enc)throw new Error('فایل این پیوست روی این رایانه پیدا نشد.');
  return aesDec(VAULT.key,enc instanceof Uint8Array?enc:new Uint8Array(enc),'att');
}
async function attDel(id){
  if(SRV){try{await api('att_del',{id})}catch(e){}return}
  if(dirOk&&dirHandle){try{(await getDir([FILES_DIR,'att'],false)).removeEntry(id+'.att')}catch(e){}}
  try{await idb.del('att:'+id)}catch(e){}
}
async function shrinkImage(file){/* photos of documents: max 2000px JPEG, enough to read and much smaller */
  return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height));if(k===1&&file.size<1.5e6){URL.revokeObjectURL(u);res(null);return}
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b),'image/jpeg',.85)};
    im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u});
}
async function accUpload(key,files,cap){
  const A=ACC();A.files[key]=A.files[key]||[];let n=0;
  for(const f of files){
    let blob=f,type=f.type||'application/octet-stream',name=f.name||'file';
    if(/^image\/(jpeg|png|webp|bmp)$/.test(type)){const s=await shrinkImage(f);if(s&&s.size<f.size){blob=s;type='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg'}}
    if(blob.size>8*1024*1024){toast('«'+name+'» بزرگ‌تر از ۸ مگابایت است و بارگذاری نشد.',6000);continue}
    const id=uid().toLowerCase().replace(/[^a-z0-9]/g,'')+Date.now().toString(36);
    toast('در حال بارگذاری «'+name+'»…',20000);
    try{await attPut(id,new Uint8Array(await blob.arrayBuffer()))}catch(e){toast('«'+name+'» بارگذاری نشد: '+e.message,6000);continue}
    A.files[key].push({id,name,type,size:blob.size,cap:cap||'',at:nowTs(),by:curUser()});n++;
  }
  if(n){save();toast(toFa(n)+' فایل پیوست شد'+(SRV?' (رمزشده روی سرور)':''),4000)}
}

async function galMakeThumb(file){
  const draw=(src,w,h)=>{const k=Math.min(1,520/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.78))};
  const url=URL.createObjectURL(file);
  try{
    if(galIsImg(file.type))return await new Promise(res=>{const im=new Image();im.onload=()=>draw(im,im.naturalWidth,im.naturalHeight).then(res);im.onerror=()=>res(null);im.src=url});
    if(galIsVid(file.type))return await new Promise(res=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';let done=false;const fin=b=>{if(!done){done=true;res(b)}};
      setTimeout(()=>fin(null),8000);v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1.5,(v.duration||2)/3)}catch(e){fin(null)}};v.onseeked=()=>draw(v,v.videoWidth,v.videoHeight).then(fin);v.onerror=()=>fin(null);v.src=url});
  }catch(e){}finally{setTimeout(()=>URL.revokeObjectURL(url),9000)}
  return null;
}

async function prvUpload(files){

/* ---------- phone book: people and organisations ----------
   A customer is a person or an organisation. An organisation has any number of people, each with department,
   position, mobile, landline (and extension), email and notes. The phone book lists everyone together
   (people, organisations' main numbers, and every person of every organisation with organisation, department
   and position), searchable by any of them. Tapping a number calls on a phone; from the panel an SMS with a
   protected link (an invoice of that customer, a product profile, or gallery files) can be sent. */
let PB={q:'',org:'',dept:''};
function custIsOrg(c){return (c.ctype||(c.kind==='legal'?'org':'person'))==='org'}
function pbEntries(){
  const out=[];
  S.customers.forEach(c=>{
    if(!String(c.name||'').trim())return;
    const org=custIsOrg(c);
    out.push({k:'c:'+c.id,cid:c.id,name:c.name,org:org?'':(c.company||''),dept:'',role:org?'سازمان':(c.role||''),mobile:c.mobile||'',phone:c.phone||'',ext:'',email:c.email||'',note:c.notes||'',isOrg:org,city:c.city||''});
    if(org)(c.contacts||[]).forEach(p=>out.push({k:'p:'+c.id+':'+p.id,cid:c.id,pid:p.id,name:p.name,org:c.name,dept:p.dept||'',role:p.role||'',mobile:p.mobile||'',phone:p.phone||'',ext:p.ext||'',email:p.email||'',note:p.note||'',isOrg:false,city:c.city||''}));
  });
  return out;
}
function telHref(n){const d=normDigits(String(n||'')).replace(/[^\d+]/g,'');return d?'tel:'+d:''}
function smsHref(n){const m=mobileOf(n);return m?'sms:'+m:''}
function renderPhone(){

  const orgs=[...new Set(all.filter(e=>e.org).map(e=>e.org))].sort((a,b)=>a.localeCompare(b,'fa'));
  const depts=[...new Set(all.filter(e=>e.dept&&(!PB.org||e.org===PB.org)).map(e=>e.dept))].sort((a,b)=>a.localeCompare(b,'fa'));
  const list=all.filter(e=>(!PB.org||e.org===PB.org||(e.isOrg&&e.name===PB.org))&&(!PB.dept||e.dept===PB.dept)&&(!q&&!qd||(q&&normName([e.name,e.org,e.dept,e.role,e.email,e.city,e.note].join(' ')).includes(q))||(qd.length>=3&&normDigits(e.mobile+' '+e.phone).replace(/\D/g,'').includes(qd))))
    .sort((a,b)=>normName(a.name).localeCompare(normName(b.name),'fa'));
  const num=(n,ext)=>{const t=telHref(n);return t?`<a class="pb-num" href="${esc(t)}" dir="ltr">${esc(toFa(n))}${ext?' <small>داخلی '+esc(toFa(ext))+'</small>':''}</a>`:''};
  host.innerHTML=`<div class="stack"><div class="card"><div class="card-h"><h3>دفتر تلفن <small>${toFa(list.length)} از ${toFa(all.length)} نفر و سازمان</small></h3><div class="btns"><button class="btn sm" data-act="pb-newPerson">${IC.plus} شخص</button><button class="btn sm" data-act="pb-newOrg">${IC.plus} سازمان</button></div></div>
   <div class="inline" style="flex-wrap:wrap"><input id="pbQ" placeholder="جستجوی نام، سازمان، واحد، سمت، شماره یا ایمیل" value="${esc(PB.q)}" style="flex:2;min-width:220px">
    <select id="pbOrg" style="flex:1;min-width:160px">${opt('','همه‌ی سازمان‌ها',PB.org)}${orgs.map(o=>opt(o,o,PB.org)).join('')}</select>
    <select id="pbDept" style="flex:1;min-width:140px">${opt('','همه‌ی واحدها',PB.dept)}${depts.map(o=>opt(o,o,PB.dept)).join('')}</select></div></div>
  <div class="pb-grid">${list.map(e=>`<div class="pb-card${e.isOrg?' org':''}"><div class="pb-h"><div><b class="pb-name">${e.isOrg?'🏢 ':''}${esc(e.name)}</b>${e.org?`<div class="pb-sub">${esc(e.org)}${e.dept?' · '+esc(e.dept):''}${e.role?' · '+esc(e.role):''}</div>`:e.role&&!e.isOrg?`<div class="pb-sub">${esc(e.role)}</div>`:''}</div>
     <button class="btn sm" data-act="pb-edit" data-cid="${esc(e.cid)}" title="ویرایش">✎</button></div>
    <div class="pb-nums">${e.mobile?`<span>همراه: ${num(e.mobile)}</span>`:''}${e.phone?`<span>تلفن: ${num(e.phone,e.ext)}</span>`:''}${e.email?`<span>ایمیل: <a href="mailto:${esc(e.email)}" dir="ltr">${esc(e.email)}</a></span>`:''}${e.note?`<small class="muted" style="white-space:pre-wrap">${esc(e.note)}</small>`:''}</div>
    <div class="acts" style="justify-content:flex-start;flex-wrap:wrap">${telHref(e.mobile||e.phone)?`<a class="btn sm pri" href="${esc(telHref(e.mobile||e.phone))}">📞 تماس</a>`:''}${smsHref(e.mobile)?`<a class="btn sm" href="${esc(smsHref(e.mobile))}">پیامک گوشی</a>`:''}${SRV&&mobileOf(e.mobile)?`<button class="btn sm" data-act="pb-send" data-k="${esc(e.k)}">ارسال لینک با پیامک</button>`:''}</div></div>`).join('')||'<div class="card empty">کسی پیدا نشد.</div>'}</div></div>`;
}

     ${(c.contacts||[]).map((p,i)=>`<div class="ce-p"><div class="grid g4">${[['name','نام و نام خانوادگی'],['dept','واحد (مثلاً حسابداری، بازرگانی)'],['role','سمت'],['mobile','همراه',1],['phone','تلفن ثابت',1],['ext','داخلی',1],['email','ایمیل',1]].map(([k,l,ltr])=>`<label class="f"><span>${l}</span><input data-cp="${i}" data-k="${k}" ${ltr?'class="ltr"':''} value="${esc(p[k]||'')}" ${k==='dept'?'list="ceDepts"':''}></label>`).join('')}

function ceRead(){const m=$('#modal');const c=m._cust;if(!c)return;$$('[data-ce]').forEach(el=>c[el.dataset.ce]=el.value.trim());$$('[data-cp]').forEach(el=>{const p=c.contacts[+el.dataset.cp];if(p)p[el.dataset.k]=el.value.trim()})}

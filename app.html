  'اگر نخستین ورود روی یک نصب تازه نیمه‌کاره می‌ماند (مثلاً کند بودن هاست)، پیام «حساب شما هنوز به کلید رمزنگاری وصل نشده است» می‌آمد و هیچ‌کس نمی‌توانست وارد شود. حالا چون هنوز هیچ داده‌ای رمز نشده، ورود بعدی همان مرحله را از نو انجام می‌دهد و کد بازیابی را نشان می‌دهد؛ و کلید فقط وقتی ثبت می‌شود که حساب کاربر به آن وصل شده باشد.']},
 {v:'2.32.0',d:'1405/08/23',t:'امضای پیامکی قرارداد کارمند',items:[
  'در قرارداد پیش‌نویس، «ارسال برای امضای پیامکی» متن را قفل می‌کند و پیوند امضا را به موبایل کارمند پیامک می‌کند. کارمند پیوند را باز می‌کند، رمز یک‌بارمصرف پیامکی را می‌زند، متن را می‌بیند و با تیک «می‌پذیرم» امضا می‌کند.',
  'زمان، آی‌پی و اثر انگشت (SHA-256) متن امضاشده روی سرور ثبت می‌شود و پس از امضا نه متن عوض می‌شود نه پیوند باطل. برنامه وضعیت را خودکار می‌گیرد و قرارداد «امضا شده» می‌شود؛ روی نسخه‌ی چاپی هم یک خط امضای الکترونیکی می‌آید.',
  'ارسال دوباره‌ی پیامک، لغو ارسال و ثبت امضای کاغذی هم هست. برای پیامک، الگوی «لینک امضای قرارداد برای کارمند» را در تنظیمات پیامک ثبت کنید (متن: … نشانی-سایت/v.php?t=#LINK#).']},
 {v:'2.31.0',d:'1405/08/23',t:'قانون کار، قرارداد کارمندان و استهلاک ماهانه‌ی اموال',items:[
  'استهلاک ماهانه‌ی اموال: در فرم هر قلم «ثبت در حسابداری ← استهلاک ماهانه» را بزنید؛ برای هر ماه از خرید تا پایان عمر مفید (و ماه جاری) یک هزینه‌ی «استهلاک اموال» در حسابداری ساخته می‌شود و با تغییر قیمت، عمر مفید یا تاریخ فروش/اسقاط خودکار به‌روز می‌شود.',
  'قوانین اداره‌ی کار از وبی: راهنمای کامل قانون کار، تأمین اجتماعی و مالیات حقوق (تب «قانون کار»)، ارقام قانونی سال (حداقل مزد، مسکن، بن، سقف معافیت…) قابل ویرایش در تنظیمات، و بررسی خودکار انطباق پرونده‌ی کارمند، فیش حقوقی و مرخصی با قانون — فقط هشدار می‌دهد و عددی را خودکار عوض نمی‌کند.',
  'مسیر قانونی اقدام‌ها: اخراج، تعلیق، استعفا، پایان قرارداد، کسر از حقوق، تغییر شرایط و رد مرخصی با مرجع قانونی؛ و برآورد تسویه‌ی پایان کار (سنوات، مرخصی، عیدی) هنگام ثبت پایان همکاری.',
  'قرارداد کارمندان: قالب‌های آماده‌ی قرارداد (تمام‌وقت، مدت معین، پاره‌وقت، پروژه‌ای، ساعتی) با مقدارهای خودکار از پرونده، چاپ روی سربرگ شرکت، ثبت امضا و قفل متن، اثر انگشت متن، اسکن امضاشده، تمدید و یادآوری پایان قرارداد در پیشخوان. قالب‌های نمونه را پیش از استفاده مشاور حقوقی بازبینی کند.']},
 {v:'2.30.0',d:'1405/08/23',t:'یکپارچه شدن بخش‌های شرکت: واحدها، کارتابل، حسابداری و دسترسی‌ها',items:[
  'واحدهای سازمانی (مالی، فروش، انبار…) با مدیر واحد: کارمند، قلم اموال و نامه به واحد وصل می‌شوند و نامه‌ها بر اساس واحد فیلتر می‌شوند.',
  'کارتابل من (برای هر کاربر): ارجاع‌های باز نامه، ثبت ورود و خروج، درخواست مرخصی، فیش‌های حقوقی خود، اموال تحت عهده و پیش‌نویس نامه‌ها. نام کاربری ورود به پرونده‌ی کارمند وصل می‌شود.',
  'ارجاع نامه به کارمند یا واحد با دستور و مهلت؛ گیرنده انجام را با پاسخ ثبت می‌کند و در پیشخوان یادآوری می‌شود. امضاکننده‌ی نامه از فهرست کارمندان انتخاب می‌شود و نامه می‌تواند به یک فاکتور یا پیش‌فاکتور وصل شود.',
  'حسابداری: با «ثبت پرداخت» فیش حقوق، هزینه‌ی حقوق و بیمه‌ی سهم کارفرما، و با تیک «ثبت در حسابداری» خرید اموال، خودکار به هزینه‌های حسابداری می‌روند (با نشان «خودکار»؛ برگرداندنشان فقط از همان بخش).',
  'مرخصی را مدیر واحد یا مدیر تأیید می‌کند. کارمندان در دفتر تلفن هم دیده می‌شوند. جابه‌جایی اموال (عهده‌دار، محل، واحد) در تاریخچه‌ی قلم ثبت می‌شود.',
  'نقش‌های آماده (حسابدار، دبیرخانه، مسئول منابع انسانی، مسئول اموال، کارمند) و دسترسی جدا برای دیدن مبلغ حقوق‌ها.']},
 {v:'2.29.0',d:'1405/08/23',t:'نامه‌ها، اموال، کارمندان و ایستگاه چاپِ چندسایتی',items:[
  'پنجره‌های افزودن مشتری و سازمان (و همه‌ی پنجره‌ها) دیگر با کلیک بیرون از کادر یا Esc بسته نمی‌شوند و ورودی‌هایتان پاک نمی‌شود؛ فقط با دکمه‌ی «بستن» بسته می‌شوند.',
  'بخش تازه‌ی «نامه‌ها» (منوی «دفتر اداری»): قالب سربرگ آزاد با ویرایشگر متن (عکس، جدول، رنگ، لوگو، پس‌زمینه‌ی تمام‌صفحه و نقش‌ونگار)، ساخت نامه از روی قالب، شماره‌ی یکتا در «دفتر اندیکاتور» (صادره، وارده و داخلی)، رونوشت، قفل‌شدن پس از صدور، ابطال، و QR صحت‌سنجی مثل فاکتورها.',
  'نامه را می‌شود با پیامک (پیوند صحت‌سنجی) یا ایمیل برای گیرنده و رونوشت‌ها فرستاد. ایمیل (SMTP) از «نامه‌ها ← شماره‌گذاری و ایمیل» تنظیم می‌شود و رمز صندوق رمزشده روی سرور می‌ماند. برای پیامک، الگوی «لینک نامه برای گیرنده» را در تنظیمات پیامک ثبت کنید.',
  'بخش تازه‌ی «اموال»: دسته‌بندی با الگوی کدِ جدا برای هر دسته، تولید کد، تا ۳ عکس، سریال، مدل، سال تولید و خرید، فاکتور خرید با عکس، مشخصات خریدار، عمر مفید و استهلاک، انبارگردانی با کد، و چاپ برچسب QR.',
  'بخش تازه‌ی «کارمندان و حقوق»: پرونده‌ی کارمند، حضور و غیاب (ماهانه و برگه‌ی روزانه)، مرخصی با مانده، مزایا و کسورات، محاسبه‌ی حقوق (بیمه، اضافه‌کار، مالیات قابل تنظیم)، فیش حقوقی چاپی و تأیید و قفل ماهانه.',
  'مدیر می‌تواند برای هر کاربر تعیین کند کدام بخش‌ها را ببیند (کارمندان ← دسترسی در سیستم).',
  'ایستگاه چاپ نسخه‌ی ۲٫۱: یک برنامه به چند سایت Invora سرویس می‌دهد (هر سایت نشانی و توکن خودش را دارد) و همه‌ی تنظیمات در همان صفحه‌ی http://localhost:8766 است. با اجرای ZIP یک سایت دیگر، آن سایت به فهرست اضافه می‌شود.']},
 {v:'2.28.1',d:'1405/08/20',t:'صفحه‌ی ورود خلوت‌تر',items:[
  'با زدن «ورود با کد پیامکی»، فرم رمز و بقیه‌ی دکمه‌ها کنار می‌روند و فقط نام کاربری و کد می‌ماند؛ «← ورود با رمز» برمی‌گرداند. انتخاب در همان مرورگر به یاد می‌ماند.']},
 {v:'2.28.0',d:'1405/08/20',t:'پر شدن خودکار کد در اندروید (درست) و «کد درست نیست»',items:[
  'الگوی پیامک کد مثل وبی شد: خط آخر «@دامنه #VERIFICATIONCODE#» و سایت مقدار آن را «#کد» می‌فرستد. متن قبلی («@دامنه #CODE#») در sms.ir بی علامت # می‌رسید و اندروید کد را برنمی‌داشت. الگوهای «کد ورود» و «رمز QR اصالت» را در sms.ir با متن تازه‌ی «تنظیمات عمومی ← پیامک» ویرایش کنید (دو پارامتر: CODE و VERIFICATIONCODE).',
  'اگر چند بار «فرستادن کد» زده شود، کد پیامک‌های قبلی هم تا پایان مهلت (۵ دقیقه) پذیرفته می‌شود؛ پیش‌تر کد پیامک اول «کد درست نیست» می‌گرفت.']},
 {v:'2.27.2',d:'1405/08/20',t:'پر شدن خودکار کد پیامکی مثل وبی',items:[
  'خواندن خودکار کد در اندروید مثل وبی شد: درخواستِ خواندن پیامک یک بار ساخته می‌شود و تا ترک صفحه منتظر می‌ماند (پیش‌تر با زدن دوباره‌ی «فرستادن کد» لغو و از نو ساخته می‌شد و کدِ «Allow» به آن نمی‌رسید).',
  'عیب‌یابی: صفحه‌ی ورود را با ‎?otpdebug=1‎ در آخر نشانی باز کنید تا مراحل خواندن کد پایین صفحه نوشته شود.']},
 {v:'2.27.1',d:'1405/08/20',t:'پر شدن کد پیامکی',items:[
  'کدی که اندروید از پیامک برمی‌دارد (حتی با رقم فارسی) در خانه‌ی کد نوشته و ورود انجام می‌شود؛ اگر خواندن خودکار انجام نشود، دلیلش زیر فرم نوشته می‌شود.',
  'می‌شود کل متن پیامک را در خانه‌ی کد چسباند (خود کد از آن برداشته می‌شود)، یا با دکمه‌ی «چسباندن کدِ کپی‌شده» کدی را که از پیامک کپی کرده‌اید وارد کرد.']},
 {v:'2.27.0',d:'1405/08/20',t:'ورود پیامکی بی‌دردسرتر و کپچا',items:[
  'وقتی کاربرِ دارای شماره‌ی موبایل روی دستگاهی با رمز وارد شود، ورود پیامکی برای همان دستگاه خودش روشن می‌شود؛ از دفعه‌ی بعد روی همان دستگاه کد پیامکی کار می‌کند (از «حساب کاربری» خاموش می‌شود).',
  'اگر کد ورود فرستاده نشود، دلیلش (شماره ثبت نشده، یا ورود پیامکی روی آن دستگاه روشن نیست) در «گزارش پیامک» مدیر نوشته می‌شود.',
  'از چهارمین «فرستادن کد» در یک ساعت (از یک مرورگر یا یک اینترنت)، کپچا (عددهای تصویر) لازم است تا ربات نتواند پیامک پشت پیامک بفرستد.']},
 {v:'2.26.0',d:'1405/08/20',t:'ثبت موبایل کاربران برای ورود پیامکی',items:[
  'در «تنظیمات عمومی ← کاربران» مدیر شماره‌ی موبایل هر کاربر را ثبت یا عوض می‌کند (هنگام افزودن کاربر هم)، و می‌بیند ورود پیامکی روی چند دستگاهِ او روشن است.',
  'کاربر روی هر دستگاه یک بار با رمز وارد می‌شود و ورود با پیامک را برای همان دستگاه روشن می‌کند؛ از آن به بعد با کد پیامکی وارد می‌شود.']},
 {v:'2.25.0',d:'1405/08/20',t:'کد ورود پیامکی خودکار در اندروید',items:[
  'در گوشی اندروید (Chrome)، کد ورود پیامکی خودش از پیامک برداشته، وارد و فرستاده می‌شود؛ رمز صفحه‌ی «تأیید اصالت سند» (QR) هم همین‌طور. در آیفون کد بالای صفحه‌کلید پیشنهاد می‌شود.',
  'برای این کار خط آخر الگوی پیامک در sms.ir باید «@دامنه‌ی سایت #CODE#» باشد؛ متن آماده در «تنظیمات عمومی ← پیامک» است.']},
 {v:'2.24.0',d:'1405/08/18',t:'منوی دسته‌بندی‌شده و دکمه‌ی تنظیمات پرینتر',items:[
  'منو دسته‌بندی شد: «صدور» (صدور تکی، صدور گروهی، اسناد)، «حسابداری»، «مخاطبان» (مشتریان، دفتر تلفن)، «کالا و کاتالوگ»، «چاپ» و «تنظیمات» (شرکت‌ها، تنظیمات عمومی). با بردن نشانگر یا زدن روی هر دسته، زیرمنویش باز می‌شود.',
  '«تنظیمات پرینتر» در منوی «چاپ» و کنار دانلود ایستگاه چاپ: صفحه‌ی تنظیمات برنامه‌ی ایستگاه (http://localhost:8766) را باز می‌کند — روی همان کامپیوتری که ایستگاه چاپ رویش نصب است.']},
 {v:'2.23.0',d:'1405/08/18',t:'QR تأیید اصالت و صدور تازه بعد از ثبت',items:[
  'روی هر سندِ ثبت‌شده (نسخه‌ی تحت وب) کنار جای مهر و امضا یک QR چاپ می‌شود. با اسکن آن، صفحه‌ی «تأیید اصالت سند» در سایت باز می‌شود.',
  'برای دیدن سند رمز لازم است: با باز شدن صفحه، رمزی یک‌بارمصرف به «رابطِ» سند پیامک می‌شود و صفحه نام رابط و بخشی از شماره‌اش را نشان می‌دهد تا اسکن‌کننده بداند رمز را از چه کسی بگیرد. بدون رمز چیزی از سند دیده نمی‌شود.',
  'رابط هر سند در کارت «QR تأیید اصالت» صفحه‌ی سند (یا از دفتر تلفن) تعیین می‌شود و بعد از ثبت هم عوض می‌شود؛ رابط پیش‌فرض هر شرکت در «شرکت‌ها ← QR تأیید اصالت» است.',
  'هر اسکن، پیامک رمز، رمز درست یا اشتباه و دیدن سند با آی‌پی و دستگاه ثبت می‌شود («گزارش اسکن‌ها»). اسکنِ سندِ حذف‌شده می‌گوید سند معتبر نیست.',
  'الگوی پیامک تازه‌ی «رمز دیدن سند با QR اصالت» در «تنظیمات عمومی ← پیامک»؛ اگر ثبت نشود، الگوی «کد ورود» به کار می‌رود.',
  'در «صدور تکی» و «صدور گروهی» بعد از ثبت، صفحه خودش برای صدور تازه آماده می‌شود؛ سند یا گروهِ ثبت‌شده با یک دکمه باز یا چاپ می‌شود.']},
 {v:'2.22.0',d:'1405/08/18',t:'اسناد: اول منتظر واریز، بعد منتظر تأیید خریدار',items:[
  'در «اسناد» به‌طور پیش‌فرض اول فاکتورهای «منتظر واریز» و بعد فاکتورهای «منتظر تأیید خریدار» می‌آیند؛ هر گروه از تازه به قدیم.',
  'فیلتر تازه‌ی «وضعیت» (منتظر واریز، منتظر تأیید خریدار، پیش‌نویس، واریز کامل، بقیه) با شمار هرکدام، و مرتب‌سازی با سرستون «وضعیت».',
  'وضعیت پرداخت (با مانده‌ی منتظر واریز) کنار وضعیت هر سند نوشته می‌شود.']},
 {v:'2.21.0',d:'1405/08/18',t:'صدور گروهی: یک سند با پیروها',items:[
  'در «اسناد» هر صدور گروهی یک ردیف است (فاکتور اصلی) و سندهای پیرو با دکمه‌ی «گروهی · n پیرو» زیر همان ردیف باز می‌شوند. «چاپ گروه» همه‌ی سندهای گروه را چاپ می‌کند و انتخابِ فاکتور اصلی همه‌ی پیروها را هم انتخاب می‌کند.',
  'سندهای پیرو تأیید خریدار و واریز ندارند و در حسابداری، پرونده‌ی مشتری و آمار فروش نمی‌آیند؛ فقط فاکتور اصلی تأیید خریدار می‌گیرد.',
  'وقتی فاکتور اصلی تأیید خریدار بگیرد، پیروهایش هم برای همیشه قفل می‌شوند.',
  'تأییدهایی که پیش‌تر روی سندهای پیرو ثبت شده بود (و واریزی نداشت) برداشته شد.']},
 {v:'2.20.0',d:'1405/08/18',t:'قفل سند، تأیید خریدار و ترتیب اسناد',items:[
  'سندِ ثبت‌شده قفل است و دیگر تغییر نمی‌کند. مدیر با «ویرایش با تأیید مدیر» و نوشتن دلیل می‌تواند بازش کند؛ نسخه‌ی پیش از ویرایش با زمان، کاربر و دلیل در «تاریخچه‌ی ویرایش» همان سند می‌ماند و دیدن و بازگرداندنش ممکن است. «لغو ویرایش» تغییرات را دور می‌ریزد.',
  '«تأیید توسط خریدار»: بعد از آن سند برای همیشه قفل است و حذف هم نمی‌شود — حتی توسط مدیر. برای تغییر، «کپی» بزنید تا با شماره‌ی تازه صادر شود.',
  'حسابداری: فقط فاکتوری که تأیید خریدار گرفته طلب ما حساب می‌شود و به «منتظر واریز» و پرونده‌ی مشتری می‌رود؛ بقیه خارج از حساب‌اند. «تأیید پرداخت»های قبلی همان تأیید خریدار حساب شدند.',
  'اسناد را می‌شود بر اساس تاریخ سند، زمان صدور، مشتری، مبلغ یا شماره مرتب کرد (با زدن سرستون یا از فهرست «ترتیب»)؛ ترتیب انتخابی می‌ماند.',
  'چاپ و اشتراک‌گذاری فاکتور و پیش‌فاکتور بعد از ثبت هم با مهر و امضا، فقط مهر، فقط امضا یا بدون آن‌ها ممکن است؛ خودِ سند تغییری نمی‌کند.',
  'سند ثبت‌شده را فقط مدیر حذف می‌کند.']},
 {v:'2.19.0',d:'1405/08/18',t:'نصب خودکار ایستگاه چاپ',items:[
  'ایستگاه چاپ حالا یک برنامه‌ی آماده‌ی ویندوز است (InvoraPrint.exe): پایتون و همه‌ی کتابخانه‌ها داخلش است، پس برای نصب نه پایتون لازم است نه دانلود چیزی از اینترنت.',
  'نصب با یک دوبار کلیک: اجازه‌ی Administrator می‌گیرد، خودش را نصب می‌کند، نشانی سایت و توکن ایستگاه را از فایل دانلودشده برمی‌دارد، با ورود به ویندوز خودش اجرا می‌شود، اگر بسته شود خودش دوباره بالا می‌آید، چاپگرهای شبکه‌ای و اشتراکیِ کاربر را هم می‌بیند، میان‌بر تنظیمات را روی دسکتاپ می‌گذارد و صفحه‌ی تنظیمات را باز می‌کند.',
  'به‌روزرسانی: فایل تازه را دانلود و اجرا کنید؛ نسخه‌ی قبلی بسته و جایگزین می‌شود و تنظیمات چاپگرها می‌ماند.',
  'این برنامه را گیت‌هاب روی ویندوز می‌سازد و پیش از انتشار خودش می‌آزماید (نصب، اجرای خودکار، ساخت PDF با Edge، خواندن چاپگرها، به‌روزرسانی، حذف). سایت آن را یک بار از گیت‌هاب می‌گیرد و نگه می‌دارد؛ در «تنظیمات عمومی ← چاپگر مرکزی» وضعیتش دیده می‌شود.']},
 {v:'2.18.1',d:'1405/08/18',t:'نصب برنامه‌ی ایستگاه چاپ',items:[
  'نصب برنامه‌ی ایستگاه چاپ دیگر در «Installing required packages» بی‌صدا گیر نمی‌کند: پیشرفت دانلود دیده می‌شود، هر تلاش زمان محدود دارد، و اگر pypi.org کند یا بسته بود، آینه‌های ایرانی (Runflare، لیارا، hmirror) خودکار امتحان می‌شوند.',
  'پایتونِ واقعی پیدا می‌شود (اول py، نه میان‌برِ Microsoft Store)، pip اگر نبود نصب می‌شود، اجرای دوباره‌ی نصب بسته‌های نصب‌شده را دوباره دانلود نمی‌کند، و همه‌چیز در install.log نوشته می‌شود.',
  'برای گرفتن نسخه‌ی تازه، برنامه را دوباره از «تنظیمات عمومی ← چاپگر مرکزی» دانلود کنید.']},
 {v:'2.18.0',d:'1405/08/18',t:'بارگذاری و دانلود مطمئن با درصد',items:[
  'پنجره‌ی «انتقال فایل‌ها» (پایین صفحه): برای هر فایل درصد، حجم رسیده، سرعت و زمان باقی‌مانده؛ با دکمه‌های توقف، ادامه و لغو. تا انتقالی در جریان است، بستن صفحه هشدار می‌دهد.',
  'پیش از بارگذاری، فضای سرور بررسی می‌شود (فضای آزاد هاست منهای ۳۰۰ مگابایتِ ذخیره برای خود سایت، و منهای آنچه بارگذاری‌های نیمه‌کاره هنوز لازم دارند)؛ اگر جا نباشد، پیش از شروع می‌گوید چقدر لازم است و چقدر مانده. سقف دلخواه هم در config قابل تعیین است.',
  'قطع اینترنت دیگر بارگذاری را خراب نمی‌کند: تکه‌ای که نرسیده چند بار و با فاصله‌ی بیشتر دوباره فرستاده می‌شود و تا اینترنت وصل نشده، صبر می‌کند و خودش ادامه می‌دهد.',
  'اگر صفحه بسته شد یا رایانه خاموش شد، فایل در گالری «ناقص — ٪…» می‌ماند؛ با «ادامه‌ی بارگذاری» و انتخاب همان فایل (یا انتخاب دوباره‌ی آن از دکمه‌ی بارگذاری) فقط بخش‌های جامانده فرستاده می‌شود. بارگذاری نیمه‌کاره‌ای که ۱۰ روز دست نخورد، خودکار پاک می‌شود.',
  'دانلود هم تکه‌تکه و با درصد است و با قطع اینترنت ادامه می‌دهد؛ در صفحه‌ی گیرنده‌ی لینک هم دانلود هر فایل درصد و حجم را نشان می‌دهد و اگر قطع شد، «ادامه‌ی دانلود» از همان‌جا ادامه می‌دهد.']},
 {v:'2.17.0',d:'1405/08/18',t:'پروفایل محصول و دفتر تلفن',items:[
  'هر کالا «پروفایل» دارد (کالا و خدمات ← پروفایل): مشخصات فنی به‌صورت جدول، توضیح کامل، عکس محصول، و کاتالوگ‌ها، عکس‌ها، فیلم‌ها و مدارکِ همان محصول (بارگذاری مستقیم یا انتخاب از گالری).',
  'عکس محصول در فاکتور: با یک تیک، عکس کوچک کالا کنار نامش در ردیف فاکتور و پیش‌فاکتور چاپ می‌شود.',
  'برای پروفایل محصول لینک رمزدار ساخته می‌شود (با یا بدون قیمت) و با پیامک برای مشتری می‌رود؛ گیرنده بعد از رمز، عکس، مشخصات، توضیح و فایل‌های محصول را در یک صفحه می‌بیند.',
  'مشتری «شخص» یا «سازمان»: برای شخص همراه، تلفن، ایمیل، محل کار، سمت و نشانی؛ برای سازمان همه‌ی مشخصات به‌علاوه‌ی هر تعداد فرد با واحد (حسابداری، بازرگانی…)، سمت، همراه، تلفن ثابت و داخلی، ایمیل و توضیح.',
  'بخش تازه‌ی «دفتر تلفن»: همه‌ی افراد و سازمان‌ها با ذکر سازمان، واحد و سمت؛ جستجو با نام، سازمان، واحد، سمت، شماره یا ایمیل. روی گوشی با زدن شماره تماس گرفته می‌شود؛ «پیامک گوشی» و از پنل «ارسال لینک با پیامک» (یک فاکتور همان مشتری، پروفایل یک محصول یا فایل‌های گالری) با همه‌ی قانون‌های لینک رمزدار.',
  'چاپ آدرس: گیرنده از میان افراد سازمان‌ها، با سمت و نام سازمان.']},
 {v:'2.16.0',d:'1405/08/18',t:'کاتالوگ و گالری با لینک رمزدار',items:[
  'بخش تازه‌ی «کاتالوگ و گالری» (نسخه‌ی وب): کاتالوگ‌های محصولات (PDF، Word، Excel، عکس…) و گالری عکس و فیلم را بارگذاری کنید؛ با عنوان، توضیح و آلبوم/دسته، جستجو و دیدن و دانلود.',
  'فایل‌ها تکه‌تکه بارگذاری می‌شوند، پس فیلم‌های بزرگ (تا ۱ گیگابایت) هم با محدودیت هاست مشکلی ندارند؛ روی سرور رمزشده نگه داشته می‌شوند.',
  'چند عکس، فیلم و کاتالوگ را تیک بزنید و برایشان «یک لینک» بسازید. گیرنده بعد از زدن رمز، همه را در یک صفحه می‌بیند: عکس‌ها، پخش فیلم (با جلو و عقب زدن) و دانلود هر فایل.',
  'قانون یکسان برای همه‌ی لینک‌ها (فاکتور، کاتالوگ و گالری): همیشه رمزدار، مدت اعتبار، حداکثر دفعات دریافت، غیرفعال شدن بعد از ۵ رمز اشتباه، گزارش کامل دسترسی، رمزِ همیشه قابل دیدن و فرستادن با پیامک. لینکی که غیرفعال یا منقضی شود، همان لحظه برای کسی که رمز را زده هم بسته می‌شود.',
  'تا رمز زده نشود، در صفحه‌ی لینک هیچ نامی از فایل‌ها نمی‌آید.']},
 {v:'2.15.0',d:'1405/08/18',t:'پرونده‌ی مشتری در حسابداری',items:[
  'در «حسابداری ← مشتریان و پرونده‌ها» هر مشتری یک پرونده دارد: جمع فاکتورها، دریافت‌شده، مانده‌ی تأییدشده، فاکتورهای تأیید پرداخت‌نشده، پیش‌فاکتورها، اولین و آخرین خرید، و خلاصه به تفکیک سال.',
  'فهرست همه‌ی سفارش‌ها و سندهای هر مشتری با وضعیت مالی هرکدام. برای هر سفارش «پرونده‌ی سفارش» باز می‌شود: هر تعداد یادداشت (با تاریخ، ساعت و نام نویسنده؛ قابل ویرایش) و هر تعداد مدرک پیوست (عکس، PDF، Word، Excel و… تا ۸ مگابایت).',
  'یک پرونده‌ی کلی هم برای خود مشتری هست، برای مدارکی که به سفارش خاصی مربوط نیست (قرارداد، کارت ملی، نامه‌ها).',
  'مشتری‌ای که در «مشتریان» ذخیره نشده هم از روی فاکتورهایش (با شناسه‌ی ملی یا نام) پرونده دارد. در فهرست «مشتریان» دکمه‌ی «پرونده» مستقیم به پرونده‌ی همان مشتری می‌رود.',
  'فایل‌ها جدا از اطلاعات اصلی و رمزشده نگه داشته می‌شوند: نسخه‌ی وب روی سرور، نسخه‌ی آفلاین در پوشه‌ی داده (یا اگر پوشه وصل نیست، در همین مرورگر). عکس‌های بزرگ پیش از بارگذاری کوچک می‌شوند.']},
 {v:'2.14.0',d:'1405/08/18',t:'اثر انگشت، پیامک، حسابداری و چاپگر مرکزی',items:[
  'ورود با اثر انگشت / چهره / پین گوشی و رایانه (مثل وبی): «تنظیمات عمومی ← ورود با اثر انگشت و پیامک ← ثبت اثر انگشت این دستگاه»، و در صفحه‌ی ورود دکمه‌ی «ورود با اثر انگشت». فقط روی دستگاهی کار می‌کند که همان‌جا فعالش کرده‌اید، چون کلید اطلاعات رمزشده با راز همان دستگاه باز می‌شود.',
  'پیامک با پنل sms.ir (فقط با الگو، مثل وبی): فرستادن لینک فایل (و اگر بخواهید رمز) برای مشتری از پنجره‌ی اشتراک‌گذاری، و «ورود با کد پیامکی» که مدیر روشن می‌کند. حالت آزمایشی، پیامک آزمایشی و گزارش پیامک‌ها هم دارد. کدِ لینک‌های تازه ۲۲ نویسه است تا در پیامک جا شود.',
  'بخش تازه‌ی «حسابداری»: دکمه‌ی «تأیید پرداخت» روی فاکتورها (جدا از ثبت سند) فاکتور را به دفتر حسابداری می‌فرستد تا منتظر اعلام واریز بماند. با تأیید واریز، اول هزینه‌های ماه (حقوق، اجاره، خرید و… که ماهانه یا موردی تعریف می‌کنید) پوشانده می‌شود و باقی به نسبت ضریب شراکت به شرکا تعلق می‌گیرد.',
  'تسویه با شرکا: پرداخت به هر شریک ثبت می‌شود و بعد از تأیید شما (و اگر خواستید با بارگذاری عکس فیش واریز) طلبش تسویه می‌شود. گزارش ماهانه‌ی واریز، هزینه، سهم شرکا و هزینه‌ی پوشش‌نیافته.',
  'چاپگر مرکزی (مثل وبی): برنامه‌ی کوچک «ایستگاه چاپ» روی کامپیوتر دفتر نصب می‌شود (روی ویندوز به‌صورت سرویس که با هر روشن شدن خودش اجرا می‌شود) و فاکتور، گروهی از سندها و برچسب‌ها را از هرجا روی چاپگر دفتر چاپ می‌کند؛ پورتی باز نمی‌شود و محتوای کارها روی سرور رمزشده است.',
  'لینک دانلود برنامه‌ی ایستگاه چاپ در «تنظیمات عمومی ← چاپگر مرکزی» است؛ دکمه‌ی «دانلود برنامه با همین توکن» فایلی می‌دهد که نشانی سایت و توکن ایستگاه از قبل در آن نوشته شده است.',
  'چاپ آدرس و برچسب: گیرنده‌های دستی برای نامه و پاکت (بدون ساختن مشتری)، گیرنده از میان خریداران فاکتورها، عنصر «خط برش ✂»، و چاپ برچسب روی چاپگر مرکزی (برچسب‌زن و حرارتی با اندازه‌ی دقیق، از جمله زبان TSPL).',
  'پیشخوان: یادآوری فاکتورهای منتظر واریز و تسویه‌های در انتظار؛ آخرین ورود همراه با روش ورود (رمز، اثر انگشت یا پیامک).']},
 {v:'2.13.0',d:'1405/08/17',t:'پیشخوان، چاپ چندصفحه‌ای و لینک‌های امن‌تر',items:[
  'صفحه‌ی اول برنامه «پیشخوان» است: تاریخ شمسی، میلادی و قمری، ساعت تهران، تعطیلی امروز و بعدی، گزارش مالی امروز و این ماه و امسال (به تفکیک شرکت)، پیش‌فاکتورهای باز، کارهای مانده، آخرین سندها، آخرین ورود و منوی کار. با زدن روی لوگو هم به پیشخوان برمی‌گردید.',
  'کارهای مانده: پیش‌نویس ناتمام، صدور گروهی ثبت‌نشده، پیش‌فاکتورِ رو به انقضا، فاکتور رسمیِ ثبت‌نشده یا ردشده در سامانه‌ی مودیان، و یادآوری پشتیبان.',
  'فاکتوری که کمی از یک برگه بلندتر است، با فاصله‌های کمتر و در صورت نیاز قلم کمی کوچک‌تر روی همان یک برگه چاپ می‌شود؛ دیگر پانویس و مهر و امضا تنها به صفحه‌ی بعد نمی‌رود.',
  'اگر اقلام در یک برگه جا نشوند، ادامه‌ی اقلام به برگه‌ی بعد می‌رود: پایین برگه «ادامه در صفحه‌ی بعد» و «جمع نقل به صفحه‌ی بعد»، بالای برگه‌ی بعد «جمع نقل از صفحه‌ی قبل»، و جمع کل و مبلغ به حروف و توضیحات در برگه‌ی آخر.',
  'همه‌ی برگه‌ها سربرگ، جای مهر و امضا و پانویس دارند و پایینشان «صفحه‌ی ۱ از ۲» نوشته می‌شود. هر برگه دقیقاً یک A4 است و در هر چاپگری وسط کاغذ می‌نشیند؛ پیش‌نمایش هم همان برگه‌ها را نشان می‌دهد.',
  'لینک دانلود: رمزِ هر لینک همیشه در فهرست لینک‌های سند دیده می‌شود و دکمه‌ی «کپی متن» دارد (برای لینک‌های تازه).',
  'در لینک، متن پیام و صفحه‌ی دریافت، تا رمز درست زده نشود هیچ نامی از سند، خریدار، شرکت یا حتی «فاکتور» نمی‌آید.',
  'رمز با فاصله، «رمز:»، اعداد فارسی یا نشانه‌های نامرئیِ کپی هم پذیرفته می‌شود؛ رمز ناقص تلاش اشتباه حساب نمی‌شود؛ و اگر مرورگرِ گیرنده (مثلاً مرورگر داخل پیام‌رسان) کوکی را نپذیرد، به‌جای «رمز اشتباه» پیام روشن می‌دهد.']},
 {v:'2.12.0',d:'1405/08/15',t:'نام و توضیح کالا برای هر شرکت در صدور گروهی',items:[
  'در صدور گروهی بخش تازه‌ی «نام و توضیح کالا برای هر شرکت»: برای هر شرکت می‌توانید نام و توضیح هر ردیف را متفاوت از فاکتور ۱ بنویسید.',
  'قیمت، مقدار، تاریخ و قاعده‌های گروه مثل قبل از فاکتور ۱ می‌آید؛ با تغییر فاکتور ۱ نام‌های اختصاصی هر شرکت حفظ می‌شود.',
  'دکمه‌ی «پر کردن با متن فاکتور ۱» برای شروع ویرایش، و «همه مثل فاکتور ۱» برای برگرداندن.',
  'نوشتن «-» در توضیح یعنی آن ردیف در سند آن شرکت توضیح نداشته باشد.']},
 {v:'2.11.1',d:'1405/08/15',t:'نوشتن یا ننوشتن اعتبار پیش‌فاکتور',items:[
  'جمله‌ی «این پیش‌فاکتور تا تاریخ … معتبر است» (و «اعتبار تا» بالای برگه) را می‌شود خاموش کرد: برای یک سند با تیک کنار «مدت اعتبار»، یا برای همیشه‌ی یک شرکت در صفحه‌ی «شرکت‌ها».',
  'مدت اعتبار ۰ روز هم یعنی این جمله نوشته نشود.']},
 {v:'2.11.0',d:'1405/08/15',t:'انتخاب سندهای چاپ گروهی',items:[

function cmpVer(a,b){const x=String(a).split('.').map(n=>parseInt(n)||0),y=String(b).split('.').map(n=>parseInt(n)||0);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
const faVer=v=>toFa(String(v));
function renderVerPill(){const el=$('#verPill');if(el)el.textContent='نسخه '+faVer(APP_VERSION)}
function showChanges(sinceVer,title){
  const list=sinceVer?APP_CHANGES.filter(c=>cmpVer(c.v,sinceVer)>0):APP_CHANGES;
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="modal-box" style="width:min(720px,100%)"><div class="modal-h"><h3>${esc(title||'نسخه‌ها و تغییرات')}</h3><button class="btn" data-act="modal-close">بستن</button></div>
  <div class="chg">${list.map(c=>`<div class="chg-v ${c.v===APP_VERSION?'cur':''}"><div class="chg-h"><b>نسخه ${faVer(c.v)}</b>${c.v===APP_VERSION?'<span class="badge acc">نسخه‌ی فعلی</span>':''}<span class="muted">${toFa(c.d)}</span><span>— ${esc(c.t)}</span></div><ul>${c.items.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`).join('')}</div>
  ${!sinceVer?`<small class="note">کد کامل و تاریخچه‌ی تغییرات در <span dir="ltr">github.com/md6410/Invora</span>.</small>`:''}</div>`;
}
function whatsNew(){
  let seen=null;try{seen=localStorage.getItem('df-seen-ver')}catch(e){}
  try{localStorage.setItem('df-seen-ver',APP_VERSION)}catch(e){}
  if(seen&&cmpVer(APP_VERSION,seen)>0&&!LOCKED)showChanges(seen,'تازه‌های نسخه‌ی '+faVer(APP_VERSION));
}
const THEMES=['auto','light','dark'];
const THEME_IC={auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
  light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};
function curTheme(){let t='auto';try{t=localStorage.getItem('df-theme')||'auto'}catch(e){}return THEMES.includes(t)?t:'auto'}
function applyTheme(t){
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  const b=$('#themeBtn');if(b){b.innerHTML=THEME_IC[t];b.title={auto:'حالت روز و شب: خودکار (طبق سیستم)',light:'حالت روز',dark:'حالت شب'}[t]+' — برای تغییر کلیک کنید'}
  const dark=t==='dark'||(t==='auto'&&typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=dark?'#121615':'#1e5a55';
}
function cycleTheme(){const t=THEMES[(THEMES.indexOf(curTheme())+1)%THEMES.length];try{localStorage.setItem('df-theme',t)}catch(e){}applyTheme(t);toast({auto:'حالت خودکار (طبق تنظیم سیستم)',light:'حالت روز',dark:'حالت شب'}[t])}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme(curTheme()))}catch(e){}

/* ---------- updates ---------- */
let UPD=null,UPD_NOTICE='';
async function updTick(){
  if(!SRV||!S)return;
  try{const j=await api('update_tick');UPD=j.upd;const iv=UPD.installed.version;
    if(iv&&cmpVer(iv,APP_VERSION)>0&&UPD_NOTICE!==iv){UPD_NOTICE=iv;renderBanner()}
    if(view==='settings'&&$('#updBox'))renderUpdBox();
  }catch(e){}
}
function renderUpdBox(){
  const box=$('#updBox');if(!box)return;if(!UPD){box.innerHTML='<div class="empty">در حال بارگذاری…</div>';return}
  const u=UPD,ins=u.installed,lt=u.latest;const short=x=>x?x.slice(0,7):'—';
  const upToDate=lt.sha&&ins.sha===lt.sha;const avail=lt.sha&&ins.sha!==lt.sha;

/* ---------- HTML sanitizer: the only thing that lets rich text (typed, pasted or loaded) into the page ---------- */
const RE_TAGS=new Set('p div span b strong i em u s strike del br hr h1 h2 h3 h4 ul ol li table thead tbody tfoot tr td th colgroup col img a font blockquote sub sup small center'.split(' '));
const RE_DROP=new Set('script style iframe object embed link meta form input button textarea select svg math base title head noscript template video audio canvas'.split(' '));
const RE_STY=/^(color|background|background-color|font-size|font-family|font-weight|font-style|text-decoration|text-decoration-line|text-align|direction|unicode-bidi|width|height|max-width|min-width|min-height|margin|margin-top|margin-bottom|margin-left|margin-right|padding|padding-top|padding-bottom|padding-left|padding-right|border|border-top|border-bottom|border-left|border-right|border-collapse|border-spacing|border-color|border-style|border-width|float|line-height|vertical-align|letter-spacing|text-indent|white-space|page-break-inside|break-inside|opacity|display)$/;
function reClean(html){
  const doc=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html');
  const walk=(node)=>{
    [...node.childNodes].forEach(ch=>{
      if(ch.nodeType===3)return;
      if(ch.nodeType!==1){ch.remove();return}
      const t=ch.tagName.toLowerCase();
      if(RE_DROP.has(t)){ch.remove();return}
      walk(ch);
      if(!RE_TAGS.has(t)){while(ch.firstChild)ch.parentNode.insertBefore(ch.firstChild,ch);ch.remove();return}
      const keep={};
      [...ch.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value;
        if(n==='style'){const out=[];for(let i=0;i<ch.style.length;i++){const p=ch.style[i],val=ch.style.getPropertyValue(p);if(RE_STY.test(p)&&!/url\s*\(|expression|javascript|@import|behavior/i.test(val)&&!(p==='display'&&!/^(block|inline|inline-block|table|none|flex)$/.test(val)))out.push(p+':'+val)}if(out.length)keep.style=out.join(';')}
        else if(['colspan','rowspan','width','height','align','dir','border','cellpadding','cellspacing','alt','title','valign','size','color','face'].includes(n))keep[n]=v;
        else if(n==='src'&&t==='img'&&/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(v))keep.src=v;
        else if(n==='href'&&t==='a'&&/^(https?:|mailto:|tel:)/i.test(v)){keep.href=v;keep.rel='noopener';keep.target='_blank'}
        else if(n==='class'&&/^(lt-[a-z-]+|re-keep)$/.test(v))keep.class=v});
      [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
      Object.keys(keep).forEach(k=>ch.setAttribute(k,keep[k]));
      if(t==='img'&&!ch.getAttribute('src'))ch.remove();
    });
  };
  walk(doc.body);return doc.body.innerHTML;
}

function ltFileHtml(l,draft){const co=coById(l.companyId)||{};const t=(l.no?'نامه شماره '+l.no:'پیش‌نویس نامه')+(l.subject?' — '+l.subject:'');

function ltSig(l){const c=Object.assign({},l);['vfSig','vfCSig','updatedAt','sent','log'].forEach(k=>delete c[k]);if(!(c.atts&&c.atts.length))delete c.atts;['amendOf','amendReason','amendVoid','supersededBy','voidReason'].forEach(k=>delete c[k]);return hstr(JSON.stringify(c))}

function ltContact(l){const co=coById(l.companyId)||{};return{name:l.to.name||co.vfName||'',mobile:l.to.mobile||co.vfMobile||''}}
async function ltVfPush(l){ltVfEnsure(l);const c=ltContact(l);const body={tok:l.vfTok,docId:l.id,name:c.name,mobile:c.mobile,dead:l.status==='void'};
  if(l.status!=='void'){await pgReady([]);body.html=ltFileHtml(l);body.atts=await ltAttPayload(l)}await api('vf_put',body);l.vfSig=ltSig(l);l.vfCSig=hstr(JSON.stringify([c,l.status==='void']));save()}
let ltVfT=0;async function ltVfSync(){if(!SRV||!S||!S.off)return;let ch=false;
  for(const l of S.off.letters){if(l.status==='draft'||!l.vfTok||l.dir==='in')continue;const c=ltContact(l),cs=hstr(JSON.stringify([c,l.status==='void'])),sg=ltSig(l);
    if(l.vfSig===sg&&l.vfCSig===cs)continue;if(l.status==='void'&&!l.vfSig)continue;
    try{await ltVfPush(l);ch=true}catch(e){}}
  if(ch&&view==='letters')renderLetters()}

/* the code of an item = the pattern of its category: {P} prefix · {Y}/{YY} purchase year (Jalali) · {N} running number in the category (restarts every year when "yearly") · {C} company branch code */
function asCodeFor(a,cat,n){const co=coById(a.companyId)||{};const y=+a.buyYear||d2j(todayJdn()).jy;
  return String(cat.pattern||'{P}-{N}').replace('{P}',cat.prefix||'').replace('{C}',co.branchCode||'').replace('{YY}',String(y).slice(-2)).replace('{Y}',y).replace('{N}',String(n).padStart(cat.pad||1,'0'))}

  let n=(cat.cnt[k]||0)+1,code=asCodeFor(a,cat,n);const all=OFF().assets;while(all.some(x=>x!==a&&x.id!==a.id&&x.code===code)){n++;code=asCodeFor(a,cat,n)}cat.cnt[k]=n;return code}

function hrField(el,ev){

  if(o==='hrs'){if(ev!=='change')return;const k=el.dataset.k,H=L.hrset;if(['autoPresent','thursday','taxOn'].includes(k))H[k]=el.value==='1';else if(['workStart','workEnd'].includes(k))H[k]=el.value.trim();else H[k]=offNum(el.value);save();offR(renderHr);return}
  if(o==='hrtb'){if(ev!=='change')return;const b=L.hrset.taxBr[+el.dataset.i];if(b){b[el.dataset.k]=offNum(el.value);save();offR(renderHr)}return}
  if(o==='hrat'){if(ev!=='change')return;const e=hrGet(el.dataset.e);if(!e)return;const d=el.dataset.d;L.att[e.id]=L.att[e.id]||{};const r=L.att[e.id][d]=Object.assign({},L.att[e.id][d]||{});r[el.dataset.k]=el.dataset.k==='ot'?offNum(el.value)||'':el.value.trim();
    if(['in','out'].includes(el.dataset.k)&&el.value.trim()&&!r.k)r.k='present';if(!r.k&&!r.in&&!r.out&&!r.ot&&!r.note)delete L.att[e.id][d];save();offR(renderHr);return}
  if(o==='hrlab'){if(ev!=='change')return;const k=el.dataset.k;L.hrset.labor=L.hrset.labor||{};L.hrset.labor[k]=k==='year'?el.value.trim():offNum(el.value);save();offR(renderHr);return}
  if(o==='hrct'){if(ev!=='change')return;const c=(HR.ctOpen&&L.contracts.find(x=>x.id===HR.ctOpen))||null;if(c&&c.status==='draft'){let v=el.value;if(el.classList.contains('jdate')&&parseJ(v))v=jStr(parseJ(v));c[el.dataset.k]=v;save()}return}
  if(!HR.sel)return;const e=HR.sel.e;
  if(o==='hre'){if(el.classList.contains('jdate')&&ev==='input')return;const k=el.dataset.k;let v=el.value;
    if(el.dataset.num){v=offNum(v)}else if(k==='insOn'||k==='otAllowed')v=v==='1';else if(k==='workHoursDay'||k==='workDaysWeek')v=offNum(v)||'';else if(k==='kids')v=Math.max(0,Math.round(offNum(v)));else if(el.classList.contains('jdate')&&parseJ(v))v=jStr(parseJ(v));
    offSetPath(e,k,v);if(k==='unitId'){const u=hrUnit(v);e.dept=u?u.name:''}if(el.dataset.num&&ev==='change')el.value=offNum(v)?offMoney(v):'';return}
  if(o==='hrp'&&ev==='change'){const set=new Set(e.perms||OFF_PERMS.map(x=>x[0]));el.checked?set.add(el.dataset.k):set.delete(el.dataset.k);e.perms=[...set]}
}

/* ============ LABOR LAW (قانون کار) rules, employment contracts, monthly asset depreciation ============ */
/* ---- yearly legal figures (rial) — editable in «کارمندان ← تنظیمات»; checked against the employee file, payslip and leave ---- */
const LAB_DEF={year:'1405',minDaily:5541850,minHourly:756050,minMonthly:166255500,housing:30000000,food:22000000,marriage:5000000,childFactor:3,taxExempt:400000000,otNormal:1.4,otNight:1.35,otHoliday:1.4,otFriday:1.8,weekHours:44,leaveYear:26,leaveSave:9,bonusMin:60,bonusMax:90,insEmp:7,insEr:23};
const LAB_LBL={minDaily:'حداقل دستمزد روزانه',minHourly:'حداقل دستمزد ساعتی',minMonthly:'حداقل حقوق پایه‌ی ماهانه',housing:'حق مسکن (ماهانه)',food:'بن کارگری (ماهانه)',marriage:'حق تأهل (ماهانه)',taxExempt:'سقف معافیت مالیاتی (ماهانه)'};
const LAB=()=>Object.assign({},LAB_DEF,(OFF().hrset||{}).labor||{});
const lbn=(lv,title,body,ref)=>({lv,title,body,ref:ref||''});
const fnum=n=>toFa(+(+n).toFixed(1));
function laborCheckEmp(e){
  const R=LAB(),out=[];if(!['active','suspended','leave'].includes(e.status))return out;
  const part=e.kind==='part',hd=+e.workHoursDay||0,dw=+e.workDaysWeek||0;let ratio=1;if(part&&hd&&dw&&hd*dw<R.weekHours)ratio=hd*dw/R.weekHours;
  const hourly=e.kind==='hourly',base=hourly?(+e.hourly||0):(+e.pay.base||0);

const LAB_GUIDES=[{"title":"اخراج کارمند — مسیر قانونی","level":"error","steps":["اخراج خودسرانه ممنوع است. قانون کار فقط دو حالت را می‌پذیرد: قصور در انجام وظایف، یا نقض آیین‌نامهٔ انضباطی کارگاه.","پیش از هر چیز باید <b>تذکر کتبی<\/b> داده و در پرونده ثبت شده باشد. بدون سابقهٔ تذکر کتبی، اخراج در هیئت تشخیص رد می‌شود.","سپس <b>نظر مثبت<\/b> شورای اسلامی کار یا انجمن صنفی لازم است. کارگاه‌هایی که چنین تشکلی ندارند (اغلب کسب‌وکارهای کوچک) باید نظر مثبت <b>هیئت تشخیص ادارهٔ کار<\/b> را بگیرند.","در صورت تأیید، تسویهٔ کامل الزامی است: مزد و اضافه‌کاری معوقه + مرخصی استفاده‌نشده + سنوات (یک ماه آخرین حقوق به ازای هر سال سابقه) + عیدیِ به‌نسبتِ کارکرد همان سال.","اگر بدون این مراحل اخراج کنید: کارگر ۳۰ روز فرصت شکایت دارد. اگر هیئت اخراج را غیرموجه بداند، حکم <b>بازگشت به کار + پرداخت حقوق از تاریخ اخراج<\/b> می‌دهد؛ و اگر کارگر نخواهد برگردد، ۴۵ روز مزد به ازای هر سال سابقه باید بپردازید."],"ref":"مواد ۲۷، ۲۰ و ۱۶۵ قانون کار"},{"title":"تعلیق کارمند","level":"warn","steps":["تعلیق یک‌طرفه و بدون مزد، عملاً «اخراج بی‌نام» است و در اداره کار همان حکم اخراج غیرقانونی را می‌گیرد.","تعلیق قانونی در موارد مشخصی است: خدمت سربازی، توقیف کارگر، مرخصی تحصیلی، یا توقف کار به علت قوهٔ قاهره.","اگر توقیف کارگر به شکایت کارفرما بوده و بعد بی‌گناهی ثابت شود، کارفرما باید مزد همان دوره را بپردازد.","در پایان دورهٔ تعلیق، بازگرداندن کارگر به کارِ سابق تکلیف کارفرماست."],"ref":"مواد ۱۵ تا ۲۰ قانون کار"},{"title":"پایان قرارداد مدت‌معین","level":"info","steps":["پایان مدتِ قرارداد موقت، خودبه‌خود پایان رابطه است و «اخراج» حساب نمی‌شود — به شرط اینکه واقعاً موقت باشد.","اما اگر کارِ کارگاه ماهیت مستمر دارد و قرارداد موقت بارها تمدید شده، مراجع حل اختلاف معمولاً رابطه را مستمر می‌دانند و عدم تمدید را اخراج تلقی می‌کنند.","در هر حال، تسویهٔ پایان کار الزامی است: سنوات به‌ازای هر سال سابقه (متوالی یا متناوب)، مرخصی استفاده‌نشده، عیدیِ به‌نسبت، و مطالبات معوقه.","سنوات دوره‌های قبلی، اگر مزد در این مدت بالا رفته باشد، باید بر مبنای <b>آخرین<\/b> حقوق بازمحاسبه و مابه‌التفاوتش پرداخت شود."],"r /* ---- monthly depreciation of assets → accounting expenses (one entry per asset per month; rebuilt idempotently) ---- */
function asMonthlyDep(a){const life=+a.life||0,price=+a.price||0;if(!life||!price)return 0;return Math.round(Math.max(0,price-(+a.salvage||0))/life/12)}
function asDepSync(){
  if(!S||!S.off)return;const A=ACC(),L=OFF(),now=d2j(todayJdn()),cur=now.jy*12+now.jm;let ch=false;const want=new Map();
  L.assets.forEach(a=>{if(a.acctMode!=='dep')return;const m=asMonthlyDep(a),by=a.buyDate&&parseJ(a.buyDate)?d2j(parseJ(a.buyDate)):(+a.buyYear?{jy:+a.buyYear,jm:1}:null);if(!m||!by)return;
    const start=by.jy*12+by.jm,life=+a.life*12;let end=Math.min(cur,start+life-1);if(a.endDate&&parseJ(a.endDate)){const ed=d2j(parseJ(a.endDate));end=Math.min(end,ed.jy*12+ed.jm)}
    for(let k=start;k<=end;k++){const jy=Math.floor((k-1)/12),jm=((k-1)%12)+1,mk=jy+'/'+pad2(jm);want.set('dep:'+a.id+':'+mk,{date:jStr(k===cur?todayJdn():j2d(jy,jm,monthLen(jy,jm))),title:'استهلاک '+ACC_MN[jm-1]+' '+toFa(jy)+' — '+a.name+(a.code?' ('+a.code+')':''),cat:'depr',amount:m,note:'استهلاک ماهانه‌ی اموال'})}});
  A.expenses=A.expenses.filter(x=>{if(!/^dep:/.test(x.src||''))return true;if(want.has(x.src))return true;ch=true;return false});
  want.forEach((o,key)=>{const x=A.expenses.find(e=>e.src===key);if(!x){A.expenses.push(Object.assign({id:uid(),at:nowTs(),by:'خودکار',src:key},o));ch=true}else if(x.amount!==o.amount||x.title!==o.title){Object.assign(x,o);ch=true}});
  if(ch)save()}

function offDevicePick(cb,accept,opt){let i=$('#offFile');if(!i){i=document.createElement('input');i.type='file';i.id='offFile';i.hidden=true;document.body.appendChild(i)}i.accept=accept||'image/*';i.value='';
  i.onchange=()=>{const f=i.files[0];i.value='';if(!f)return;if(SRV&&opt&&opt.archive!==false&&/^image\//.test(f.type)&&f.size<=25*1024*1024){const o=opt.origin||'other';xfUpload([f],fmKind(o),opt.folder||'',null,null,{origin:o,title:opt.title||''}).catch(()=>{})}cb(f)};i.click()}
function offPick(cb,accept,opt){accept=accept||'image/*';opt=opt||{};if(!SRV||!/^image/.test(accept)){offDevicePick(cb,accept,opt);return}fmPickModal(cb,opt)}

  const L=S.off||{lt:[]};L.lt.forEach(t=>[['bg','پس‌زمینه‌ی سربرگ'],['wm','نقش‌ونگار سربرگ']].forEach(([k,l])=>{if(t[k])out.push({origin:'official',title:l+' — '+t.name,sub:'قالب نامه',src:t[k],name:l,go:()=>{LT.tab='tpl';LT.tpl=JSON.parse(JSON.stringify(t));showView('letters')}})}));return out}

async function fmPickModal(cb,opt){
  let lay=$('#pickLayer');if(!lay){lay=document.createElement('div');lay.id='pickLayer';lay.className='modal';lay.style.zIndex='70';document.body.appendChild(lay)}

  await fmEnsure();

  const close=()=>{lay.hidden=true;lay.innerHTML=''};
  const draw=()=>{const q=normName(st.q);const real=(GAL||[]).filter(x=>x.done&&galIsImg(x.type||'')&&(!st.o||fmOrigin(x)===st.o)&&(!q||normName((x.title||'')+' '+x.name+' '+(x.folder||'')).includes(q)));

    lay.innerHTML=`<div class="modal-box" style="width:min(900px,100%)"><div class="modal-h"><h3>انتخاب تصویر</h3><div class="btns"><button class="btn pri" data-pk="dev">آپلود از دستگاه</button><button class="btn" data-pk="close">بستن</button></div></div>

     <div class="gal-grid">${real.map(x=>`<div class="gal-card"><label class="gal-pic" data-pk="real" data-id="${esc(x.id)}" style="cursor:pointer"><img src="${esc(x.thumb?galThumbUrl(x):galUrl(x))}" alt="" loading="lazy"></label><div class="gal-cap"><b>${esc(x.title||x.name)}</b><small class="muted">${esc(FM_ORIGIN[fmOrigin(x)]||'')}</small></div></div>`).join('')}${vi.map((v,i)=>`<div class="gal-card"><label class="gal-pic" data-pk="virt" data-i="${i}" style="cursor:pointer"><img src="${v.src}" alt="" loading="lazy"></label><div class="gal-cap"><b>${esc(v.title)}</b><small class="muted">${esc(FM_ORIGIN[v.origin]||'')} · داخل برنامه</small></div></div>`).join('')}</div>

    lay._vi=vi};
  const opt0=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`;
  lay.onclick=async e=>{const t=e.target.closest('[data-pk]');if(!t)return;const k=t.dataset.pk;
    if(k==='close'){close();return}
    if(k==='dev'){close();offDevicePick(cb,'image/*',opt);return}
    if(k==='real'){const x=(GAL||[]).find(y=>y.id===t.dataset.id);if(!x)return;e.preventDefault();try{const f=await fmFileFrom(x);close();cb(f)}catch(er){toast(er.message)}return}
    if(k==='virt'){e.preventDefault();const v=lay._vi[+t.dataset.i];if(!v)return;try{const r=await fetch(v.src),b=await r.blob();close();cb(new File([b],(v.name||'image')+'.'+((b.type.split('/')[1]||'png').replace('jpeg','jpg')),{type:b.type}))}catch(er){toast('تصویر خوانده نشد')}}};
  lay.oninput=lay.onchange=e=>{const t=e.target;if(t.dataset.pk==='q'){st.q=t.value;const p=t.selectionStart;draw();const n=lay.querySelector('[data-pk="q"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}else if(t.dataset.pk==='o'){st.o=t.value;draw()}};
  draw()}

async function fmUploadFiles(files,origin,folder,extra){if(!files.length)return;await xfUpload(files,fmKind(origin),folder||'',null,null,Object.assign({origin},extra||{}));fmAfterGal()}
function fmShare(ids,title){ids=ids.filter(id=>(GAL||[]).some(x=>x.id===id&&x.done));if(!ids.length){toast('فایل کاملی انتخاب نشده است');return}

function fmAction(a,b){
  const k=b&&b.dataset;
  switch(a){
    case 'fm-o':FM.origin=k.k;renderFiles();break;
    case 'fm-none':FM.sel.clear();fmAfterGal();break;
    case 'fm-share':fmShare([...FM.sel]);break;
    case 'cd-share':fmShare([...FM.sel].filter(id=>(GAL||[]).some(x=>x.id===id&&x.kind==='company')),'مدارک شرکت');break;
    case 'cd-share1':fmShare([k.id]);break;
    case 'fm-del':{const ids=[...FM.sel];if(ids.length&&confirm(toFa(ids.length)+' فایل برای همیشه از سرور حذف شود؟ (لینک‌های ساخته‌شده هم از کار می‌افتند)'))api('gal_del',{ids}).then(()=>{FM.sel.clear();return galLoad()}).then(fmAfterGal).catch(e=>toast(e.message))}break;
    case 'fm-vgo':{const v=fmVirtual()[+k.i-0]||null;const r=fmRows().find(x=>!x.real&&x.i===+k.i);if(r&&r.go)r.go()}break;
    case 'fm-vdl':{const r=fmRows().find(x=>!x.real&&x.i===+k.i);if(r){const m=String(r.src).match(/^data:([^;]+);base64,(.*)$/);if(m){const bin=atob(m[2]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);downloadBlob((r.name||'image').replace(/[\\/:*?"<>|]/g,'-')+'.'+(m[1].split('/')[1]||'png').replace('jpeg','jpg'),new Blob([u],{type:m[1]}))}}}break;
    case 'fm-vsave':{const r=fmRows().find(x=>!x.real&&x.i===+k.i);if(r)fetch(r.src).then(x=>x.blob()).then(bl=>fmUploadFiles([new File([bl],(r.name||'image').replace(/[\\/:*?"<>|]/g,'-')+'.'+(bl.type.split('/')[1]||'png').replace('jpeg','jpg'),{type:bl.type})],r.origin,'',{title:r.title}))}break;
  }
}
function fmField(el,ev){
  const o=el.dataset.o;
  if(o==='fmsel'&&ev==='change'){el.checked?FM.sel.add(el.dataset.id):FM.sel.delete(el.dataset.id);offR(fmAfterGal);return}
  if(o==='fmq'){FM.q=el.value;if(ev==='input'){const p=el.selectionStart;renderFiles();const n=$('[data-o="fmq"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}return}
  if(o==='cdq'){CD.q=el.value;if(ev==='input'){const p=el.selectionStart;renderCdocs();const n=$('[data-o="cdq"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}return}
  if(o==='cdf'&&ev==='change'){CD[el.dataset.k]=el.value;offR(renderCdocs);return}
}

/* stock + moving-average cost from the ledger (rebuilt per call; cheap for tens of thousands of rows) */
function invCalc(){const I=INV(),st={},tot={},avg={};const rows=I.mv.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  rows.forEach(m=>{const s=st[m.pid]||(st[m.pid]={});const before=tot[m.pid]||0;s[m.wh]=(s[m.wh]||0)+m.qty;tot[m.pid]=before+m.qty;
    if(m.qty>0&&m.cost>0&&(m.type==='in'||m.type==='open')){const a=avg[m.pid]||0;const nb=Math.max(0,before);avg[m.pid]=(nb+m.qty)>0?((nb*a)+(m.qty*m.cost))/(nb+m.qty):m.cost}});

  if(INV_SIGN[m.type]){m.qty=Math.abs(+m.qty||0)*INV_SIGN[m.type]}else m.qty=+m.qty||0;if(!m.qty)return null;I.mv.push(m);invDirty();return m}

function invOnCommit(doc){const I=INV();if(!I.set.autoOut||!doc||doc.stockDone||doc.type!=='invoice'||(doc.official&&doc.offSubject==='cancel'))return;

function code128(text,h,showText){text=String(text||'').replace(/[^\x20-\x7e]/g,'');if(!text)return '';const vals=[104];for(const ch of text)vals.push(ch.charCodeAt(0)-32);let sum=104;for(let i=1;i<vals.length;i++)sum+=i*vals[i];vals.push(sum%103,106);

function ivSalesBy(from,to){const map={};S.documents.filter(d=>d.committed&&d.type==='invoice'&&!(d.official&&(d.offSubject==='cancel'))&&(!from||parseJ(d.date)>=from)&&(!to||parseJ(d.date)<=to)).forEach(d=>{const sg=(d.official&&d.offSubject==='return')||d.credit?-1:1;(d.items||[]).forEach(it=>{const p=(it.pid&&invProd(it.pid))||S.products.find(x=>x.name&&x.name===it.name);const k=p?p.id:'n:'+it.name;const q=(+it.qty||0)*sg,unit=d.currency==='IRT'?10:d.currency==='USD'?((S.fx&&S.fx.rate)||0):1,rev=((+it.qty||0)*(+it.price||0)-(it.discType==='percent'?(+it.qty||0)*(+it.price||0)*(+it.disc||0)/100:(+it.disc||0)))*unit*sg;
    const r=map[k]||(map[k]={pid:p?p.id:'',name:it.name,qty:0,rev:0,cost:0});r.qty+=q;r.rev+=rev;if(p)r.cost+=q*invCost(p)})});return Object.values(map)}
function ivRep(){const r=IV.rep,f=parseJ(r.from),t=parseJ(r.to),sales=ivSalesBy(f,t).sort((a,b)=>b.rev-a.rev),c=invC();
  const tot=sales.reduce((a,x)=>({rev:a.rev+x.rev,cost:a.cost+x.cost}),{rev:0,cost:0});const low=ivLow();const cut=todayJdn()-60;const sold=new Set();S.documents.forEach(d=>{if(d.committed&&parseJ(d.date)>=cut)(d.items||[]).forEach(it=>{const p=(it.pid&&invProd(it.pid))||S.products.find(x=>x.name===it.name);if(p)sold.add(p.id)})});
  const dead=S.products.filter(p=>prodTrack(p)&&invQty(p.id)>0&&!sold.has(p.id));
  return `<div class="card"><h3>فروش و سود ناخالص <small>از فاکتورهای صادرشده؛ بها = میانگین موزون خرید</small></h3><div class="inline"><div class="inline"><input class="jdate ltr" data-o="ivr" data-k="from" placeholder="از تاریخ" value="${esc(r.from)}" style="max-width:130px"><button class="btn icon" data-act="pickdate">${IC.cal}</button></div><div class="inline"><input class="jdate ltr" data-o="ivr" data-k="to" placeholder="تا تاریخ" value="${esc(r.to)}" style="max-width:130px"><button class="btn icon" data-act="pickdate">${IC.cal}</button></div><button class="btn sm" data-act="iv-repcsv">CSV</button></div>
   <div class="grid g4"><div class="hm-stat"><small>فروش (ریال)</small><b>${offMoney(tot.rev)}</b></div><div class="hm-stat"><small>بهای کالای فروش‌رفته</small><b>${offMoney(tot.cost)}</b></div><div class="hm-stat"><small>سود ناخالص</small><b>${offMoney(tot.rev-tot.cost)}</b></div><div class="hm-stat"><small>حاشیه‌ی سود</small><b>${tot.rev?toFa(Math.round((tot.rev-tot.cost)/tot.rev*100)):'۰'}٪</b></div></div>
   ${sales.length?`<div class="tbl-wrap"><table class="list hm-list"><thead><tr><th>کالا</th><th>تعداد فروش</th><th>فروش (ریال)</th><th>بها</th><th>سود</th></tr></thead><tbody>${sales.map(x=>`<tr><td>${esc(x.name)}</td><td>${toFa(+x.qty.toFixed(3))}</td><td class="hn">${offMoney(x.rev)}</td><td class="hn">${offMoney(x.cost)}</td><td class="hn">${offMoney(x.rev-x.cost)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">فروشی در این بازه نیست.</div>'}</div>
  <div class="card"><h3>ارزش موجودی انبار <small>${offMoney(ivVal())} ریال</small></h3>${INV().wh.map(w=>{let v=0,n=0;S.products.forEach(p=>{if(prodTrack(p)){const q=(c.st[p.id]||{})[w.id]||0;if(q>0){v+=q*invCost(p);n++}}});return `<div class="inline"><b>${esc(w.name)}</b><span class="muted">${toFa(n)} قلم · ${offMoney(v)} ریال</span></div>`}).join('')}</div>
  <div class="card"><h3>کم‌موجودی (${toFa(low.length)}) و کالاهای راکد (${toFa(dead.length)} — ۶۰ روز بدون فروش)</h3><div class="grid g2"><div>${low.map(p=>`<div>${esc(p.name)}: <b>${toFa(+invQty(p.id).toFixed(3))}</b> / حداقل ${toFa(p.minStock)}</div>`).join('')||'<span class="muted">—</span>'}</div><div>${dead.slice(0,40).map(p=>`<div>${esc(p.name)}: ${toFa(+invQty(p.id).toFixed(3))} · ارزش ${offMoney(invQty(p.id)*invCost(p))}</div>`).join('')||'<span class="muted">—</span>'}</div></div></div>`}

function posCo(){return coById(POS.co)||coById(INV().set.posCo)||S.companies.find(c=>!c.sample)||S.companies[0]}
function posBuildDoc(){const co=posCo();if(!co)return null;const d=newDoc(co.id,'invoice');d.date=jStr(todayJdn());const k=d.currency==='IRT'?10:d.currency==='USD'?((S.fx&&S.fx.rate)||1):1;
  d.items=POS.cart.map(c=>{const p=invProd(c.pid)||{};return Object.assign(newItem(),{name:p.name||'کالا',code:p.code||'',unit:p.unit||'عدد',qty:+c.qty||1,price:Math.round((+c.price||0)/k*100)/100,discType:'amount',disc:Math.round((+c.disc||0)/k*100)/100,taxable:p.taxable!==false,pid:c.pid})});
  const cu=S.customers.find(x=>x.id===POS.cust);d.buyer=Object.assign(emptyBuyer(),cu?{name:cu.name||'',nationalId:cu.nationalId||'',economicCode:cu.economicCode||'',postalCode:cu.postalCode||'',address:cu.address||'',phone:cu.phone||cu.mobile||''}:{name:'مشتری حضوری'});
  d.discType='amount';d.disc=Math.round(offNum(POS.disc)/k*100)/100;d.notes=(d.notes?d.notes+'\n':'')+'فروش حضوری';d.pos={wh:POS.wh||invDefWh()};d.extra=0;return d}

  if(prodTrack(p)&&!I.set.allowNeg&&want>invQty(p.id,wh)+1e-9){toast('موجودی «'+p.name+'» در این انبار '+toFa(+invQty(p.id,wh).toFixed(3))+' است');return}

  if(o==='ivl'){const k=el.dataset.k,L=IV.lbl;if(el.type==='checkbox')L[k]=el.checked;else if(k==='size'){if(ev!=='change')return;L.size=el.value;if(el.value!=='custom'){const p=el.value.split('x');L.w=+p[0];L.h=+p[1]}offR(renderInv);return}else if(k==='w'||k==='h'){L[k]=Math.max(15,Math.min(200,offNum(el.value)||L[k]));L.size='custom'}else{L[k]=el.value;if(ev==='change'&&(k==='copies'||k==='mode')){offR(renderInv);return}}ivLblPv();return}
  if(o==='ivk'){const k=el.dataset.k,C=IV.ctl;if(ev==='input'&&el.type!=='text')return;C[k]=el.type==='checkbox'?el.checked:k==='cols'?+el.value:el.value;if(k==='cat')C.ids=[];if(ev==='change'||el.type==='text'){ivCatPv();if(k==='cat'||k==='cols')offR(renderInv)}return}
  if(o==='ivr'){if(el.classList.contains('jdate')&&ev==='input')return;IV.rep[el.dataset.k]=el.value;if(ev==='change')offR(renderInv);return}
  if(o==='ivcn'&&ev==='change'){const c=I.counts.find(x=>x.id===IV.count);if(c){c.zero=el.checked;save()}return}
  if(o==='ivcr'){const c=I.counts.find(x=>x.id===IV.count),r=c&&c.rows[+el.dataset.i];if(r){r.cnt=el.value.trim()===''?'':offNum(el.value);if(ev==='change'){save();offR(renderInv)}}return}
  if(o==='ivb'){const b=IV.buy;if(!b)return;if(el.classList.contains('jdate')&&ev==='input')return;if(el.type==='checkbox'){b[el.dataset.k]=el.checked;return}b[el.dataset.k]=el.value;if(el.dataset.k==='paid'&&ev==='change')b.paid=el.value.trim()===''?'':offNum(el.value);return}
  if(o==='ivbr'){const r=IV.buy&&IV.buy.rows[+el.dataset.i];if(!r||ev!=='change')return;const k=el.dataset.k;if(k==='p'){const p=ivFindProd(el.value);r.pid=p?p.id:'';if(p&&!+r.cost)r.cost=+p.buyPrice||invCost(p)}else r[k]=offNum(el.value);offR(ivBuyDraw);return}
  if(o==='ivp'){if(!IV.edit)return;const p=IV.edit.p,k=el.dataset.k;if(el.classList.contains('jdate')&&ev==='input')return;let v=el.value;if(el.type==='checkbox'){if(ev!=='change')return;v=el.checked}else if(el.dataset.num)v=offNum(v);p[k]=v;if(el.dataset.num&&ev==='change')el.value=v?offMoney(v):'';if(ev==='change'&&(k==='cat'||k==='currency'||k==='price'||k==='buyPrice'))offR(()=>ivProdForm(p,IV.edit.isNew,IV.edit.tab));return}
  if(o==='ivsp'){if(!IV.edit)return;const p=IV.edit.p;p.specs=p.specs&&p.specs.length?p.specs:[['','']];p.specs[+el.dataset.i][+el.dataset.j]=el.value;return}
  if(o==='posf'){const k=el.dataset.k;if(el.type==='radio'){if(ev!=='change')return;POS.pm=el.value;offR(renderPos);return}POS[k]=el.value;if(ev==='change')offR(renderPos);return}
  if(o==='posq'){POS.q=el.value;if(ev==='input'){const p=el.selectionStart;renderPos();const n=$('#posScan');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}return}
  if(o==='pose'&&ev==='change'){const c=POS.cart[+el.dataset.i];if(c){const k=el.dataset.k;c[k]=offNum(el.value);if(k==='qty'&&!(c.qty>0))POS.cart.splice(+el.dataset.i,1);offR(renderPos)}return}
}

function offTodo4(out){if(!can('inv'))return;const n=ivLow().length;if(n)out.push(['warn','کالای کم‌موجود: '+toFa(n),'home-go','انبار','inv']);const o=INV().counts.filter(c=>c.status==='open').length;if(o)out.push(['','انبارگردانی نیمه‌کاره: '+toFa(o),'home-go','انبار','inv'])}


/* ============ CREDIT NOTE (فاکتور برگشت از فروش): linked to the original invoice, lowers what the buyer owes, returns goods to stock, optional refund ============ */
const CR_REASONS=['برگشت کالا','کالای معیوب یا آسیب‌دیده','اشتباه در فاکتور','اصلاح قیمت یا تخفیف','سایر'];
function crReturned(orig){const m={};S.documents.filter(c=>c.credit&&c.committed&&c.creditRef===orig.id).forEach(c=>(c.items||[]).forEach(it=>{if(it.origItemId)m[it.origItemId]=(m[it.origItemId]||0)+(+it.qty||0)}));return m}
let CRS=null;
function crBuild(st){const o=st.orig,pick=o.items.map((it,i)=>({it,q:Math.min(+st.q[i]||0,st.left[i])})).filter(x=>x.q>0);const d=newDoc(o.companyId,'invoice');d.date=jStr(todayJdn());d.currency=o.currency;d.vatOn=o.vatOn;d.vatRate=o.vatRate;d.credit=true;d.creditRef=o.id;
  d.buyer=JSON.parse(JSON.stringify(o.buyer||emptyBuyer()));d.contact=JSON.parse(JSON.stringify(o.contact||{name:'',mobile:''}));d.settle=o.settle;
  d.items=pick.map(({it,q})=>{const c=Object.assign(newItem(),JSON.parse(JSON.stringify(it)),{id:uid(),qty:q,origItemId:it.id});delete c.fx;if(it.discType!=='%'&&it.qty)c.disc=(+it.disc||0)*q/(+it.qty);return c});
  const og=o.items.reduce((a,it)=>a+(+it.qty||0)*(+it.price||0),0),rg=pick.reduce((a,x)=>a+x.q*(+x.it.price||0),0);d.discType=o.discType;d.disc=o.discType==='%'?o.disc:(og?(+o.disc||0)*rg/og:0);d.extra=0;
  d.notes='برگشت از فروش فاکتور شماره '+toFa(o.number)+' — '+st.reason+(st.note?'\n'+st.note:'');d.pos={wh:st.wh};d.stockBack=st.back;if(!st.back)d.stockDone=true;return d}
function crModal(orig){const left=orig.items.map(it=>Math.max(0,(+it.qty||0)-((crReturned(orig))[it.id]||0)));if(!left.some(x=>x>0)){toast('همه‌ی اقلام این فاکتور قبلاً برگشت خورده‌اند');return}
  CRS={orig,left,q:left.map(()=>0),reason:CR_REASONS[0],note:'',wh:invDefWh(),back:true,refund:'',date:jStr(todayJdn())};crDraw()}
function crDraw(){const st=CRS,o=st.orig,d=crBuild(st),has=d.items.length,tot=has?accDocBase(d):0,A=ACC(),paid=accPaid(o.id),owed=Math.max(0,accDocBase(o)-accCreditSum(o.id));
  offModal(`<div class="modal-h"><h3>فاکتور برگشت از فروش — بابت ${esc(TN(o.type,o))} ${esc(toFa(o.number))}</h3><div class="btns"><button class="btn pri" data-act="cr-go"${has?'':' disabled'}>صدور فاکتور برگشت</button><button class="btn" data-act="modal-close">بستن</button></div></div>
   <div class="notice info"><span>خریدار: <b>${esc(o.buyer.name||'—')}</b> · مبلغ فاکتور ${offMoney(accDocBase(o))} ریال · دریافت‌شده ${offMoney(paid)} ریال · برگشت‌های قبلی ${offMoney(accCreditSum(o.id))} ریال</span></div>
   <div class="tbl-wrap"><table class="list"><thead><tr><th>کالا</th><th>تعداد فاکتور</th><th>قابل برگشت</th><th>تعداد برگشتی</th><th>قیمت</th></tr></thead><tbody>${o.items.map((it,i)=>`<tr><td>${esc(it.name)}</td><td>${toFa(it.qty)}</td><td>${toFa(st.left[i])}</td><td><input data-o="crf" data-i="${i}" class="ltr" value="${esc(st.q[i]||'')}" ${st.left[i]>0?'':'disabled'} style="max-width:90px"></td><td class="hn">${fmtMoney(+it.price,o.currency,true)}</td></tr>`).join('')}</tbody></table></div>
   <div class="grid g4"><label class="f"><span>علت</span><select data-o="crf" data-k="reason">${CR_REASONS.map(r=>opt(r,r,st.reason)).join('')}</select></label><label class="f" style="grid-column:span 2"><span>توضیح</span><input data-o="crf" data-k="note" value="${esc(st.note)}"></label>
   <label class="f"><span>انبار</span><select data-o="crf" data-k="wh">${INV().wh.map(w=>opt(w.id,w.name,st.wh)).join('')}</select></label>
   <label class="chk"><input type="checkbox" data-o="crf" data-k="back"${st.back?' checked':''}> کالا سالم است و به انبار برگردد</label>
   <label class="f"><span>بازپرداخت به مشتری الان (ریال)</span><input data-o="crf" data-k="refund" class="ltr" value="${esc(st.refund)}" placeholder="۰"></label><label class="f"><span>تاریخ بازپرداخت</span><input data-o="crf" data-k="date" class="jdate ltr" value="${esc(st.date)}"></label></div>
   <div class="grid g4"><div class="hm-stat"><small>جمع فاکتور برگشت (ریال، با مالیات)</small><b>${offMoney(tot)}</b></div><div class="hm-stat"><small>مانده‌ی بدهی خریدار پس از برگشت</small><b>${offMoney(Math.max(0,owed-tot))}</b></div><div class="hm-stat"><small>بیش‌پرداخت (قابل بازپرداخت)</small><b>${offMoney(Math.max(0,paid-Math.max(0,owed-tot)))}</b></div></div>
   <small class="note">فاکتور برگشت شماره‌ی جدا (R…) می‌گیرد و به فاکتور اصلی وصل است. مبلغ آن از بدهی خریدار کم می‌شود؛ اگر پول را پس می‌دهید، بازپرداخت به‌صورت واریز منفی در حسابداری ثبت می‌شود.</small>`,980)}
function crField(el,ev){const st=CRS;if(!st)return;const i=el.dataset.i;if(i!==undefined){if(ev!=='change')return;st.q[+i]=Math.max(0,Math.min(offNum(el.value),st.left[+i]));offR(crDraw);return}
  const k=el.dataset.k;if(el.type==='checkbox'){if(ev!=='change')return;st.back=el.checked;return}if(el.classList.contains('jdate')&&ev==='input')return;st[k]=el.value;if(k==='refund'&&ev==='change')st.refund=el.value.trim()===''?'':offNum(el.value)}
function crRefundDo(orig,amount,date,note){const A=ACC();if(!A.confirm[orig.id]){toast('فاکتور اصلی هنوز در حسابداری «تأیید خریدار» نشده؛ بازپرداخت ثبت نشد.',6000);return false}
  const shares={};A.partners.filter(p=>p.active!==false&&+p.coef>0).forEach(p=>shares[p.id]=+p.coef);A.deposits.push({id:uid(),docId:orig.id,amount:-Math.round(amount),date,note,at:nowTs(),by:curUser(),shares,refund:true});return true}
function crAction(a,b){
  const id=b.dataset.id||((b.closest('tr')||{}).dataset||{}).id;
  if(a==='doc-credit'){const o=S.documents.find(x=>x.id===id);if(o)crModal(o);return}
  if(a==='cr-go'){const st=CRS;if(!st)return;const d=crBuild(st);if(!d.items.length){toast('تعداد برگشتی را بنویسید');return}const tot=accDocBase(d),ref=offNum(st.refund);
    if(!parseJ(st.date)&&ref>0){toast('تاریخ بازپرداخت درست نیست');return}
    commitDoc(d,true);let msg='';if(ref>0){const ok=crRefundDo(st.orig,ref,jStr(parseJ(st.date)),'بازپرداخت — فاکتور برگشت '+d.number);msg=ok?' و بازپرداخت '+offMoney(ref)+' ریال ثبت شد':''}
    save();offClose();toast('فاکتور برگشت '+toFa(d.number)+' صادر شد'+msg+'؛ موجودی انبار و بدهی خریدار به‌روز شد.',6000);renderView();CRS=null;return}
  if(a==='cr-refund'){const c=S.documents.find(x=>x.id===id),o=c&&S.documents.find(x=>x.id===c.creditRef);if(!c||!o){toast('فاکتور اصلی پیدا نشد');return}
    const paid=accPaid(o.id),owed=Math.max(0,accDocBase(o)-accCreditSum(o.id)),over=Math.max(0,paid-owed);
    offModal(`<div class="modal-h"><h3>بازپرداخت به مشتری — ${esc(toFa(c.number))}</h3><button class="btn" data-act="modal-close">بستن</button></div><div class="notice info">دریافت‌شده از فاکتور اصلی: ${offMoney(paid)} ریال · بدهی پس از برگشت‌ها: ${offMoney(owed)} ریال · بیش‌پرداخت: <b>${offMoney(over)}</b> ریال</div>
     <div class="grid g4"><label class="f"><span>مبلغ بازپرداخت (ریال)</span><input id="crRAmt" class="ltr" value="${over?offMoney(over):''}"></label><label class="f"><span>تاریخ</span><div class="inline"><input id="crRDate" class="jdate ltr" value="${esc(jStr(todayJdn()))}"><button class="btn icon" data-act="pickdate">${IC.cal}</button></div></label></div><div class="btns"><button class="btn pri" data-act="cr-refundgo" data-id="${esc(c.id)}">ثبت بازپرداخت</button></div>`,640);return}
  if(a==='cr-refundgo'){const c=S.documents.find(x=>x.id===id),o=c&&S.documents.find(x=>x.id===c.creditRef),amt=offNum($('#crRAmt').value),d=parseJ($('#crRDate').value);if(!o||!(amt>0)||d==null){toast('مبلغ و تاریخ را درست بنویسید');return}
    if(crRefundDo(o,amt,jStr(d),'بازپرداخت — فاکتور برگشت '+c.number)){save();offClose();toast('بازپرداخت ثبت شد');renderView()}}
}

/* ---------- office modules: dispatch ---------- */
/* a redraw that removes the input being edited must not run inside its own change/blur event (Chrome throws) */
function offR(fn){setTimeout(fn,0)}
function offRoute(el,ev){const o=el.dataset.o||'';if(el.closest('.re'))return;if(o==='hru'){if(ev!=='change')return;const u=hrUnit(el.dataset.id);if(u){u[el.dataset.k]=el.value.trim();if(el.dataset.k==='name')OFF().emps.forEach(e=>{if(e.unitId===u.id)e.dept=u.name});save();if(el.dataset.k!=='name')offR(renderHr)}return}if(o==='crf')return crField(el,ev);if(o.startsWith('iv')||o.startsWith('pos'))return invField(el,ev);if(o.startsWith('fm')||o.startsWith('cd'))return fmField(el,ev);if(o.startsWith('lt'))return ltField(el,ev);if(o.startsWith('as'))return asField(el,ev);if(o.startsWith('hr'))return hrField(el,ev)}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-hg]');if(a){e.preventDefault();const t=document.getElementById('hg-'+a.dataset.hg);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}});

    d.notes='تحویل در محل خریدار ظرف ۵ روز کاری.';d.terms='پرداخت نقدی پس از تحویل. گارانتی ۱۸ ماهه.';
    commitDoc(d);S.draft=null;curId=d.id;
  }
  refreshHolidays();renderAll();setSaveState('ok');if(!data||!SRV)saveNow();

  try{await document.fonts.ready;refitAll()}catch(e){}

})();

# Builds the print station as one Windows program (InvoraPrint.exe: Python and every library inside),
# tests it on a real Windows machine (self-test, install as a Task Scheduler job running as SYSTEM,
# rendering with Edge in that account, uninstall) and, on main, publishes it as the release asset
# "print-agent" that Invora sites download and hand out with their address and station token.
name: print-agent (Windows EXE)
on:
  push:
    paths: ['print-agent/**', '.github/workflows/print-agent.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: print-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and libraries
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1 -r print-agent/requirements.txt
      - name: Build InvoraPrint.exe
        working-directory: print-agent
        run: pyinstaller --noconfirm --clean --onefile --windowed --name InvoraPrint --hidden-import win32timezone --collect-all pypdfium2 --collect-all pypdfium2_raw agent.py
      - name: Self-test as the current user
        shell: pwsh
        working-directory: print-agent
        run: |
          $p = Start-Process -FilePath dist\InvoraPrint.exe -ArgumentList 'selftest','--out',"$PWD\selftest-user.json" -Wait -PassThru
          Get-Content selftest-user.json
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Install as a SYSTEM task, check it runs, self-test as SYSTEM, uninstall
        shell: pwsh
        working-directory: print-agent
        run: |
          '{"api_url":"https://example.invalid/print-api.php","token":"ci-test-token-0123456789abcd"}' | Set-Content dist\config.json -Encoding utf8
          $p = Start-Process dist\InvoraPrint.exe -ArgumentList 'install','--quiet' -Wait -PassThru
          "install exit code: $($p.ExitCode)"
          Get-Content dist\install.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content C:\ProgramData\InvoraPrint\task.xml -ErrorAction SilentlyContinue; throw "install failed" }
          schtasks /Query /TN "Invora Print Station" /V /FO LIST | Select-String 'Status|Run As User|Task To Run'
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:8766/state -UseBasicParsing -TimeoutSec 2; "state: $($r.Content)"; $ok = $true; break } catch { Start-Sleep 1 } }
          Get-Content C:\ProgramData\InvoraPrint\agent.log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the print station did not start from Task Scheduler" }
          $cfg = Get-Content C:\ProgramData\InvoraPrint\config.json | ConvertFrom-Json
          if ($cfg.token -ne 'ci-test-token-0123456789abcd') { throw "config.json was not taken over" }
          schtasks /Create /TN InvoraSelftest /RU SYSTEM /SC ONCE /ST 23:59 /F /TR "C:\ProgramData\InvoraPrint\InvoraPrint.exe selftest --out C:\ProgramData\InvoraPrint\selftest-system.json"
          schtasks /Run /TN InvoraSelftest
          for ($i = 0; $i -lt 90; $i++) { if (Test-Path C:\ProgramData\InvoraPrint\selftest-system.json) { break }; Start-Sleep 2 }
          Start-Sleep 2
          Get-Content C:\ProgramData\InvoraPrint\selftest-system.json
          $j = Get-Content C:\ProgramData\InvoraPrint\selftest-system.json -Raw | ConvertFrom-Json
          schtasks /Delete /TN InvoraSelftest /F
          $p = Start-Process C:\ProgramData\InvoraPrint\InvoraPrint.exe -ArgumentList 'uninstall','--quiet' -Wait -PassThru
          schtasks /Query /TN "Invora Print Station" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "the task was not removed by uninstall" }
          if (-not $j.ok) { throw "self-test as SYSTEM failed" }
          $global:LASTEXITCODE = 0
      - name: Version file
        shell: pwsh
        run: |
          $v = (Select-String -Path print-agent\agent.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "$v $env:GITHUB_SHA" | Set-Content print-agent\dist\version.txt -NoNewline -Encoding ascii
          Remove-Item print-agent\dist\config.json -ErrorAction SilentlyContinue
          Get-ChildItem print-agent\dist
      - uses: actions/upload-artifact@v4
        with:
          name: InvoraPrint
          path: print-agent/dist/
          retention-days: 14
      - name: Publish the release asset (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: print-agent
          name: Invora Print Station (Windows)
          body: Ready-made Windows print station for Invora. Download it from your Invora site (General settings > Central printer), which adds your site address and station token.
          files: |
            print-agent/dist/InvoraPrint.exe
            print-agent/dist/version.txt
          make_latest: false
